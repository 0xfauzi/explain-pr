<style>
:root{--tabbar:0px}

body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;background-image:url(../assets/grain.png);background-size:240px 240px;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--ink);text-underline-offset:4px}
button{font-family:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype controls: outside the product, dashed so nobody reads them as product UI */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px auto 0;max-width:1180px;padding:8px 12px;border:1.5px dashed var(--control-border);border-radius:12px;font:500 12px/1.3 var(--mono);color:var(--text-3);width:calc(100% - 32px)}

.proto select,.proto button{font:500 12.5px var(--mono);min-height:44px;padding:0 10px;border:1.5px solid var(--control-border);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%;cursor:pointer}
.proto select#st{max-width:min(340px,58vw)}
.proto #sim{border-style:dashed}
.proto .sp{flex:1}
/* Room shell */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;height:56px;padding:0 32px;display:flex;align-items:center;gap:14px}
.word{font-size:19px;font-weight:650;font-variation-settings:"wdth" 88;letter-spacing:-.01em}
.proj{font:500 13px var(--mono);color:var(--text-3)}
.me{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-weight:650;font-size:16px;cursor:pointer}
.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:24px}
.tab{font:600 15px/1 var(--sans);min-height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-3);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tab svg{display:none}
.offbar{max-width:1180px;margin:0 auto;padding:0 32px 10px}
.offbar p{margin:0;padding:10px 14px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;font-size:15px;line-height:1.5}
.main{max-width:760px;margin:0 auto;padding:24px 32px 140px}
.link{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;font-size:14px;color:var(--text-3);padding:0 0 14px;border-bottom:1px solid var(--rule)}
.link b{font-weight:500;color:var(--ink)}
.btn{font:600 16px/1 var(--sans);min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#16161A}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 18px}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;font:600 15px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.back{margin:10px 0 0 -6px;text-decoration:none}
/* the card being consolidated */
.card{margin-top:8px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px}
.eb{font-size:13px;font-weight:500;color:var(--accent-text)}
.lvl{font:500 13px var(--mono);color:var(--text-3);margin-top:4px}
.qq{margin:8px 0 0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em;text-wrap:pretty}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin:22px 0 0}
.cmp.one{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0}
figcaption{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:8px;letter-spacing:.01em}
blockquote{margin:0;padding:12px 16px;border-left:3px solid var(--border);font-size:17px;line-height:1.5;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);font:500 12px var(--mono);white-space:nowrap;vertical-align:2px}
.chip.locked{background:var(--ink);color:var(--on-ink)}
.chip.saved{border-style:dashed}
.said .chip{margin:10px 0 0 16px}
.out{margin:0;padding:12px 14px;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;font:500 13px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.out .c{color:var(--text-3)}
.out .k{background:var(--accent-wash)}
.out.wait{white-space:normal;font-family:var(--sans);font-size:15px;color:var(--text-2)}
.out.err{border-style:dashed;white-space:normal;font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--ink)}
.sk{display:block;height:10px;border-radius:3px;background:var(--field);margin:10px 0 0}
.sk+.sk{width:62%}
.state{margin:16px 0 0;font-size:15px;color:var(--text-2)}
.in{animation:rise .6s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* gap bar: where the time went, so the gap is seen, not only read */
.gap{margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.gap h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-3)}
.track{position:relative;display:flex;height:22px;border-radius:4px;overflow:visible}
.track span{height:100%;border-right:2px solid var(--card)}
.track .t{background:var(--field);box-shadow:inset 0 0 0 1.5px var(--control-border)}
.track .b{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}
.track .j{background:var(--accent);transform-origin:left;animation:grow .6s .5s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}}
.marks{position:relative;height:56px;font:500 12px/1.3 var(--mono);color:var(--text-2)}
.marks span{position:absolute;top:0;padding-top:8px;border-left:1.5px solid var(--ink);padding-left:6px;white-space:nowrap}
.marks .r{transform:translateX(-100%);border-left:0;border-right:1.5px solid var(--ink);padding:8px 6px 0 0}
.gkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-3)}
.gkey i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
/* verdict */
.verdict{margin-top:20px;padding:22px 24px;border-radius:14px;background:var(--card);border:1.5px solid var(--border)}
.vw{margin:0;font-size:26px;font-weight:700;color:var(--accent-text);outline-offset:4px}
.vw.ok{color:var(--ink)}
.why{margin:8px 0 0;font-size:17px;line-height:1.6;color:var(--text-2);text-wrap:pretty}
.evl{margin:6px 0 0;font-size:14px;color:var(--text-3)}
.ev{font:500 13px var(--mono);min-height:44px;padding:0 4px;margin:0 2px;border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;vertical-align:baseline}
.ev svg{transition:transform .2s}
.ev[aria-expanded="true"] svg{transform:rotate(90deg)}
pre.ex{margin:4px 0 0;padding:12px 16px;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;font:500 13px/1.8 var(--mono);overflow-x:auto}
pre.ex .hd{display:block;color:var(--text-3)}
pre.ex .ln{display:block;margin:0 -16px;padding:0 16px;white-space:pre}
pre.ex i{display:inline-block;width:2.4em;color:var(--text-3);font-style:normal}
pre.ex .hl{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--ink)}
.next{margin:12px 0 0;font-size:16px;font-weight:600}
.belief{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--accent);font-size:15px;line-height:1.6;color:var(--ink)}
.ans{margin:14px 0 0;padding:14px 16px;background:var(--paper);border-radius:12px;font-size:16px;line-height:1.6;color:var(--ink)}
.ans h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--text-3)}
.ans p{margin:0}
.delta{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 150px 44px;gap:6px 14px;align-items:center;font-size:15px}
.delta .lab{grid-column:1/-1;font-size:13px;color:var(--text-3)}
.delta .dl b{font:500 13px var(--mono);color:var(--ink);margin-right:8px}
.delta .dl svg{vertical-align:-1px;margin:0 6px}
.delta .note{grid-column:1/-1;margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--text-3)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg{height:14px;border-radius:3px;background:var(--lv0);transition:background-color .55s var(--ease-out),transform .55s var(--ease-spring),box-shadow .3s}
.seg.f1{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f2{background:var(--lv2);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f3{background:var(--lv3);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg.ring{box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg.lit{transform:scaleY(1.15)}
.cell{position:relative;justify-self:center;width:28px;height:28px;border-radius:6px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}
.cell.f1{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}.cell.f2{background:var(--lv2);box-shadow:inset 0 0 0 1.5px var(--ink)}.cell.f3{background:var(--lv3);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.ring{outline:2px solid var(--ink);outline-offset:2px}
.cell.lit{transform:scale(1.12)}
.cell i{position:absolute;bottom:6px;width:2px;height:9px;background:#16161A}
.cell.f3 i{background:#F5F4F0}
.cell i:nth-child(1){left:6px}.cell i:nth-child(2){left:10px}.cell i:nth-child(3){left:14px}
.cell b{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.cue{margin:8px 0 0;font:500 13px/1.7 var(--mono);color:var(--text-2)}
.backto{margin:20px 0 0;padding-top:18px;border-top:1px solid var(--rule)}
.backto .btn{width:100%}
.appeal{margin:10px 0 0 -6px;font-size:14px;font-weight:500;color:var(--text-3)}
.cchip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;border:1.5px solid var(--ink);font:500 13px var(--mono)}
.seg.pend,.cell.pend{outline:1.5px dashed var(--ink);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
label.fl{display:block;margin-top:18px;font-weight:600;font-size:15px}
textarea{display:block;width:100%;margin-top:8px;padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--control-border);border-radius:14px;resize:vertical}
textarea[readonly]{background:var(--paper)}
.helper{font-size:14px;color:var(--text-3);margin:8px 0 0}
.re{margin:14px 0 0;font-size:16px;line-height:1.6;color:var(--ink)}
.re b{font-weight:700}
/* the chat door: a neutral frame, not any product's chrome */
.frame{margin-top:16px;border:1.5px solid var(--ink);border-radius:18px;background:var(--card);overflow:hidden}
.fh{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-bottom:1.5px solid var(--border);font:500 12.5px var(--mono);color:var(--text-3)}
.fh i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--control-border)}
.msgs{padding:16px;display:grid;gap:14px}
.msg{max-width:92%;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{justify-self:end;padding:10px 14px;background:var(--field);border-radius:14px}
.msg.ag{color:var(--ink)}
.msg .who{display:block;font:500 11.5px var(--mono);color:var(--text-3);margin-bottom:2px}
.cmd{font:500 13px/1.7 var(--mono);color:var(--text-2);padding:8px 12px;border:1.5px solid var(--border);border-radius:10px}
.fn{margin:12px 0 0;font-size:14px;color:var(--text-3)}
/* toast */
.toastwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 20px);z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px 14px;width:100%;max-width:640px;padding:8px 8px 8px 18px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:15px;line-height:1.5;box-shadow:0 8px 24px rgba(22,22,26,.08);animation:rise .3s var(--ease-out) both}
.toast p{margin:0;flex:1}
.toast .x{flex:none;width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:10px;font-size:20px;line-height:1}
@media (max-width:640px){
:root{--tabbar:0px}
.bar,.offbar{padding-left:16px;padding-right:16px}
.main{padding:16px 16px calc(var(--tabbar) + 110px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);gap:0;background:var(--paper);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{flex-direction:column;justify-content:center;gap:4px;height:64px;font-size:12px;border-bottom:0;border-top:2px solid transparent}
.tab[aria-current="page"]{border-top-color:var(--accent)}
.tab svg{display:block}
.card{padding:16px;border-radius:14px}
.qq{font-size:20px}
.cmp{grid-template-columns:minmax(0,1fr);gap:16px}
.verdict{padding:16px 16px 18px}
.vw{font-size:22px}
.why{font-size:16px}
.delta{grid-template-columns:minmax(0,1fr) 44px}
.delta .segs{grid-column:1;grid-row:3}
.delta .cell{grid-row:2/4;grid-column:2}
.acts .btn{width:100%}
.proto{gap:6px 8px}.proto .sp{display:none}.proto label[for=st]{flex-basis:100%}.proto select#st{flex:1 1 200px;max-width:none;min-width:0}
}
@media (prefers-reduced-motion:reduce){
.in,.toast,.track .j{animation:none !important}
.seg,.cell,.btn,.ev svg{transition:none}
.seg.lit,.cell.lit{transform:none}
}
</style>

var cur=0,ui={},timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clear(){timers.forEach(clearTimeout);timers=[]}

function excerpt(k,line){var c=CODE[k],h='<span class="hd">'+esc(c.path)+':'+c.from+'-'+(c.from+c.lines.length-1)+'</span>';
 c.lines.forEach(function(t,i){var n=c.from+i;h+='<span class="ln'+(n===line?' hl':'')+'"><i>'+n+'</i>'+esc(t)+'</span>'});
 return '<pre class="ex" id="exc" hidden aria-label="'+esc(c.path)+', line '+line+' marked">'+h+'</pre>'}
function cellHTML(lv,best,mark,pend){var h='<span class="cell'+(lv?' f'+lv:'')+(best>lv?' ring':'')+(pend?' pend':'')+'" aria-hidden="true">';for(var i=0;i<lv;i++)h+='<i></i>';return h+(mark?'<b></b>':'')+'</span>'}
function segsHTML(lv,best){var h='<div class="segs" aria-hidden="true">';for(var i=1;i<=3;i++)h+='<span class="seg'+(i<=lv?' f'+i:(i<=best?' ring':''))+'"></span>';return h+'</div>'}
function deltaHTML(x){var t=x.from!==x.to?'<span class="lvw">'+LV[x.from]+'</span>'+CHEV+'<span class="lvw">'+LV[x.to]+'</span>':'<span class="lvw">'+LV[x.to]+'</span>'+(x.pend?'. Without help pending the review on 10 Nov.':x.mark?'. Sure miss marked.':'. No change.');
 var name=x.topic+': now '+LV[x.to]+(x.best>x.to?', best '+LV[x.best]:'')+(x.mark?', sure miss':'');
 return '<div class="delta" id="delta"><div class="lab">Your record</div><div class="dl"><b>'+esc(x.topic)+'</b>'+t+'<span class="vh"> ('+esc(name)+')</span></div>'+segsHTML(x.from,x.from===x.to?x.best:x.from)+cellHTML(x.from,x.from===x.to?x.best:x.from,x.mark,x.pend)+'<p class="note">'+esc(x.note)+'</p></div>'}
function animateDelta(x){if(x.from===x.to)return;var dl=$('#delta');if(!dl)return;
 var go=function(){var segs=dl.querySelectorAll('.seg');for(var i=0;i<3;i++){var n=i+1;segs[i].className='seg'+(n<=x.to?' f'+n:(n<=x.best?' ring':''))+(n===Math.max(x.to,x.from)&&!RM.matches?' lit':'')}
  var c=dl.querySelector('.cell');c.outerHTML=cellHTML(x.to,x.best,x.mark);c=dl.querySelector('.cell');if(!RM.matches){c.classList.add('lit');}
  later(function(){dl.querySelectorAll('.lit').forEach(function(e){e.classList.remove('lit')})},550)};
 if(RM.matches)go();else later(go,900)}

function saidHTML(d,locked){var chip=d.offline?'<span class="chip saved">Not sent</span>':(d.dk?'':'<span class="chip'+(locked?' locked':'')+'">'+esc(d.conf)+'</span>');
 return '<figure class="said"><figcaption>You said</figcaption><blockquote>'+(d.dk?'I do not know.':esc(d.said))+'</blockquote>'+chip+'</figure>'}
function didHTML(d){var h='<figure><figcaption>It did</figcaption>';
 if(d.phase==='wait')h+='<div class="out wait"><span class="mono" style="font:500 13px var(--mono);color:var(--text-3)">$ '+esc(d.cmd)+'</span><span class="sk"></span><span class="sk"></span><p class="state" style="margin-top:12px">Waiting for the test output.</p></div>';
 else if(d.phase==='error')h+='<div class="out err"><span style="font:500 13px var(--mono);color:var(--text-3)">$ '+esc(d.cmd)+'</span><p style="margin:8px 0 0">The test ran, but I could not read its output. Your prediction stays locked. Claude shows the result in chat.</p></div>';
 else h+='<pre class="out'+(ui.anim?' in':'')+'"><span class="c">$ '+esc(d.cmd)+'</span>\n'+d.out.map(function(l){return esc(l).replace('&lt;k&gt;','<span class="k">').replace('&lt;/k&gt;','</span>')}).join('\n')+'</pre>';
 return h+'</figure>'}

 parts.forEach(function(p){h+='<span class="'+p[0]+'" style="width:'+(p[1]/tot*100).toFixed(2)+'%"></span>'});
 return '<div class="gap"><h3 id="gapt">Where the time went</h3><p class="vh">Three timeouts of 0.8 s and backoffs of 0.5 s and 1 s make 3.9 s. Jitter of up to 0.1 s after each backoff makes 4.1 s.</p><div aria-hidden="true"><div class="track">'+h+'</div><div class="marks"><span style="left:'+(3.9/tot*100).toFixed(2)+'%" class="r">You said 3.9 s</span><span style="left:'+(4.1/tot*100).toFixed(2)+'%;top:24px;padding-top:4px" class="r">It did 4.1 s</span></div></div><div class="gkey" aria-hidden="true"><span><i style="background:var(--field);box-shadow:inset 0 0 0 1.5px var(--control-border)"></i>timeout 0.8 s</span><span><i style="background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)"></i>backoff</span><span><i style="background:var(--accent)"></i>jitter on line 41, the part you left out</span></div></div>'}
function backBtn(cue){return '<div class="backto"><button type="button" class="btn" data-act="back">Back to the build</button><p class="cue">'+esc(cue)+'</p></div>'}

function verdictHTML(d){var c=CODE[d.ev[0]],path=c.path+':'+d.ev[1];
 var h='<section class="verdict'+(ui.anim?' in':'')+'" aria-labelledby="vw"><h2 class="vw'+(d.ok||d.vw==='Correct.'?' ok':'')+'" id="vw" tabindex="-1">'+esc(d.vw)+'</h2>';
 h+='<p class="why">'+esc(d.why)+'</p><p class="evl">'+(d.evPre?esc(d.evPre):'Evidence:')+' <button type="button" class="ev" data-act="ev" aria-expanded="false" aria-controls="exc">'+esc(path)+CHEV+'</button></p>'+excerpt(d.ev[0],d.ev[1]);

 if(d.belief)h+='<p class="belief">'+esc(d.belief)+'</p>';

 if(d.restate){h+='<form id="rs"><label class="fl" for="rst">Your answer, with the missing part</label><textarea id="rst" rows="3" aria-describedby="rsh">'+esc(ui.rsText||d.said)+'</textarea><p class="helper" id="rsh">Not graded. It helps it stick.</p><div class="acts"><button type="submit" class="btn sm">Save it</button><button type="button" class="btn ghost sm" data-act="skip">Next</button></div></form><div id="rsout"></div>'}

function roomHTML(d){var h='<button type="button" class="tbtn back" data-act="inbox">'+BACKCHEV+'Inbox</button>';
 h+='<article class="card" aria-labelledby="qq"><div class="eb">'+esc(d.eb)+'</div><div class="lvl">'+esc(d.topic)+' · <span class="lvw">'+LV[d.level]+'</span></div><h1 class="qq" id="qq">'+esc(d.q)+'</h1>';

 else if(d.phase==='error')h+=backBtn(d.cue);
 else if(d.offline)h+='<p class="state">Not sent yet. Keep this page open until it says Sent.</p>'+backBtn(d.cue);
 else if(d.kind!=='predict')h+=verdictHTML(d);
 return h+'</article>'}

function chatLines(d){var you=d.chatYou||(d.dk?"don't know":d.said+' '+d.conf+'.'),L=[['you',you]];
 if(d.offline)return null;
 if(d.phase==='wait'){L.push(['ag','Locked. Shown after test_retry_budget runs.']);return L}
 if(d.kind==='predict'){L.push(['cmd','Bash  pytest -k test_retry_budget']);L.push(['ag','You said: '+d.said+' ('+d.conf.toLowerCase()+')\nIt did: '+d.chatDid+'\nThe gap: '+d.gap+' billing/charge.py:41.\n'+d.cue]);return L}
 if(d.saved){L=[['you','Now add a dead letter queue for failed charges.'],['cmd','lwb_sync  1 answer from the Room'],['ag','From the Room: idempotency, Correct. It counts at your review on 10 Nov.\n\nI will add a dead letter queue table and move a charge there when RetryBudgetSpent is raised.']];return L}
 var p=CODE[d.ev[0]].path+':'+d.ev[1],t=d.vw+' '+d.why+' '+p+'. '+d.next;
 if(d.restate)t+='\nSay it again in one line if you like. Not graded. It helps it stick.';
 if(d.belief)t+='\nYou chose Sure. This one returns tomorrow and is marked on your map.';
 if(d.delta.from!==d.delta.to)t+='\nNow '+LV[d.delta.to]+'.';
 L.push(['ag',t+'\n'+d.cue]);return L}
function chatHTML(d){var L=chatLines(d),h='<p class="fn" style="margin-top:4px">The same card in the session transcript. One card, one state, every door.</p><div class="frame" role="region" aria-label="Session transcript, generic frame"><div class="fh"><i></i>session · orbit-pay</div><div class="msgs">';
 if(!L)h+='<p class="msg ag">Chat is the session itself, so it has no offline state. An answer saved on the phone reaches it when the phone is back online.</p>';
 else L.forEach(function(m){h+=m[0]==='cmd'?'<div class="cmd">'+esc(m[1])+'</div>':'<p class="msg '+(m[0]==='you'?'you':'ag')+'"><span class="who">'+(m[0]==='you'?'Sam':'Agent')+'</span>'+esc(m[1])+'</p>'});
 return h+'</div></div>'}

 $('#main').innerHTML=door==='chat'?chatHTML(d):roomHTML(d);

 else if(a==='back'){toast(d.phase==='wait'?'Opening the session. The result is shown there after the test runs.':d.phase==='error'?'Opening the session. Claude shows the result there.':d.offline?'The session opens when you are back online. Keep this page open until it says Sent.':'Opening the session. Your next message there starts with this result.')}

for(var i=0;i<S.length;i++)if(S[i].key===k)cur=i;
render(false);
