.cell{position:relative;justify-self:center;width:28px;height:28px;border-radius:6px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}

.cell i{position:absolute;bottom:6px;width:2px;height:9px;background:#16161A}

.cue{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--rule);font:500 13px/1.7 var(--mono);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
label.fl{display:block;margin-top:18px;font-weight:600;font-size:15px}

.re{margin:14px 0 0;font-size:16px;line-height:1.6;color:var(--ink)}

.frame{margin-top:16px;border:1.5px solid var(--ink);border-radius:18px;background:var(--card);overflow:hidden}

.toastwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 20px);z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px 14px;width:100%;max-width:640px;padding:8px 8px 8px 18px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:15px;line-height:1.5;box-shadow:0 8px 24px rgba(22,22,26,.08);animation:rise .3s var(--ease-out) both}
.toast p{margin:0;flex:1}
.toast .x{flex:none;width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:10px;font-size:20px;line-height:1}
@media (max-width:640px){
:root{--tabbar:calc(64px + env(safe-area-inset-bottom))}
.bar,.offbar{padding-left:16px;padding-right:16px}

.tab[aria-current="page"]{border-top-color:var(--accent)}
.tab svg{display:block}

.qq{font-size:20px}
.cmp{grid-template-columns:minmax(0,1fr);gap:16px}
.verdict{padding:16px 16px 18px}
.vw{font-size:22px}
.why{font-size:16px}

.delta .segs{grid-column:1;grid-row:3}

.acts .btn{width:100%}
.proto{gap:6px 8px}.proto .sp{display:none}.proto label[for=st]{flex-basis:100%}.proto select#st{flex:1 1 200px;max-width:none;min-width:0}
}
@media (prefers-reduced-motion:reduce){
.in,.toast,.track .j{animation:none !important}

var cur=0,ui={},timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clear(){timers.forEach(clearTimeout);timers=[]}

function excerpt(k,line){var c=CODE[k],h='<span class="hd">'+esc(c.path)+':'+c.from+'-'+(c.from+c.lines.length-1)+'</span>';
 c.lines.forEach(function(t,i){var n=c.from+i;h+='<span class="ln'+(n===line?' hl':'')+'"><i>'+n+'</i>'+esc(t)+'</span>'});
 return '<pre class="ex" id="exc" hidden aria-label="'+esc(c.path)+', line '+line+' marked">'+h+'</pre>'}
function cellHTML(lv,best,mark){var h='<span class="cell'+(lv?' f'+lv:'')+(best>lv?' ring':'')+'" aria-hidden="true">';for(var i=0;i<lv;i++)h+='<i></i>';return h+(mark?'<b></b>':'')+'</span>'}
function segsHTML(lv,best){var h='<div class="segs" aria-hidden="true">';for(var i=1;i<=3;i++)h+='<span class="seg'+(i<=lv?' f'+i:(i<=best?' ring':''))+'"></span>';return h+'</div>'}
function deltaHTML(x){var t=x.from!==x.to?LV[x.from]+CHEV+LV[x.to]:LV[x.to]+(x.mark?'. Sure miss marked.':'. No change.');
 var name=x.topic+': now '+LV[x.to]+(x.best>x.to?', best '+LV[x.best]:'')+(x.mark?', sure miss':'');
 return '<div class="delta" id="delta"><div class="lab">Your record</div><div class="dl"><b>'+esc(x.topic)+'</b>'+t+'<span class="vh"> ('+esc(name)+')</span></div>'+segsHTML(x.from,x.from===x.to?x.best:x.from)+cellHTML(x.from,x.from===x.to?x.best:x.from,x.mark)+'<p class="note">'+esc(x.note)+'</p></div>'}
function animateDelta(x){if(x.from===x.to)return;var dl=$('#delta');if(!dl)return;
 var go=function(){var segs=dl.querySelectorAll('.seg');for(var i=0;i<3;i++){var n=i+1;segs[i].className='seg'+(n<=x.to?' f'+n:(n<=x.best?' ring':''))+(n===Math.max(x.to,x.from)&&!RM.matches?' lit':'')}
  var c=dl.querySelector('.cell');c.outerHTML=cellHTML(x.to,x.best,x.mark);c=dl.querySelector('.cell');if(!RM.matches){c.classList.add('lit');}
  later(function(){dl.querySelectorAll('.lit').forEach(function(e){e.classList.remove('lit')})},550)};
 if(RM.matches)go();else later(go,900)}

function saidHTML(d,locked){var chip=d.offline?'<span class="chip saved">Saved here</span>':(d.dk?'':'<span class="chip'+(locked?' locked':'')+'">'+esc(d.conf)+'</span>');
 return '<figure class="said"><figcaption>You said</figcaption><blockquote>'+(d.dk?'I do not know.':esc(d.said))+'</blockquote>'+chip+'</figure>'}
function didHTML(d){var h='<figure><figcaption>It did</figcaption>';
 if(d.phase==='wait')h+='<div class="out wait"><span class="mono" style="font:500 13px var(--mono);color:var(--text-3)">$ '+esc(d.cmd)+'</span><span class="sk"></span><span class="sk"></span><p class="state" style="margin-top:12px">Waiting for the test output.</p></div>';
 else if(d.phase==='error')h+='<div class="out err"><span style="font:500 13px var(--mono);color:var(--text-3)">$ '+esc(d.cmd)+'</span><p style="margin:8px 0 0">The test ran, but I could not read its output. Your prediction stays locked. Claude shows the result in chat.</p></div>';
 else h+='<pre class="out'+(ui.anim?' in':'')+'"><span class="c">$ '+esc(d.cmd)+'</span>\n'+d.out.map(function(l){return esc(l).replace('&lt;k&gt;','<span class="k">').replace('&lt;/k&gt;','</span>')}).join('\n')+'</pre>';
 return h+'</figure>'}
function gapHTML(){var parts=[['t',.8],['b',.5],['j',.1],['t',.8],['b',1],['j',.1],['t',.8]],tot=4.3,h='';
 parts.forEach(function(p){h+='<span class="'+p[0]+'" style="width:'+(p[1]/tot*100).toFixed(2)+'%"></span>'});
 return '<div class="gap"><h3 id="gapt">Where the time went</h3><p class="vh">Three timeouts of 0.8 s and backoffs of 0.5 s and 1 s make 3.9 s. Jitter of up to 0.1 s after each backoff makes 4.1 s.</p><div aria-hidden="true"><div class="track">'+h+'</div><div class="marks"><span style="left:'+(3.9/tot*100).toFixed(2)+'%" class="r">You said 3.9 s</span><span style="left:'+(4.1/tot*100).toFixed(2)+'%;top:24px;padding-top:4px" class="r">It did 4.1 s</span></div></div><div class="gkey" aria-hidden="true"><span><i style="background:var(--field);box-shadow:inset 0 0 0 1.5px var(--control-border)"></i>timeout 0.8 s</span><span><i style="background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)"></i>backoff</span><span><i style="background:var(--accent)"></i>jitter, the part you left out</span></div></div>'}
function backBtn(){return '<div class="acts"><button type="button" class="btn" data-act="back">Back to the build</button></div>'}

 var h='<section class="verdict'+(ui.anim?' in':'')+'" role="status" aria-live="polite" aria-labelledby="vw"><h2 class="vw'+(d.ok||d.vw==='Correct.'?' ok':'')+'" id="vw" tabindex="-1">'+esc(d.vw)+'</h2>';
 h+='<p class="why">'+esc(d.why)+'</p><p class="evl">'+(d.evPre?esc(d.evPre):'Evidence:')+' <button type="button" class="ev" data-act="ev" aria-expanded="false" aria-controls="exc">'+esc(path)+CHEV+'</button></p>'+excerpt(d.ev[0],d.ev[1]);
 h+='<p class="next">'+esc(d.next)+'</p>';
 if(d.belief)h+='<p class="belief">'+esc(d.belief)+'</p>';
 if(d.answer)h+='<div class="ans"><h3>The answer</h3><p>'+esc(d.answer)+'</p></div>';
 if(d.wrote)h+='<button type="button" class="tbtn" data-act="wrote" aria-expanded="false" aria-controls="wrote" style="margin-top:8px;margin-left:-6px">What you wrote on '+esc(d.wrote.date)+'</button><div class="ans" id="wrote" hidden><p>'+esc(d.wrote.text)+'</p></div>';
 if(d.restate){h+='<form id="rs"><label class="fl" for="rst">Your answer, with the missing part</label><textarea id="rst" rows="3" aria-describedby="rsh">'+esc(ui.rsText||d.said)+'</textarea><p class="helper" id="rsh">One line. You can say it again once.</p><div class="acts"><button type="submit" class="btn sm">Lock my answer</button><button type="button" class="btn ghost sm" data-act="skip">Next</button></div></form><div id="rsout" aria-live="polite"></div>'}
 h+=deltaHTML(d.delta);
 if(d.saved)h+='<p class="state">'+esc(d.saved)+'</p>';
 if(d.full)h+='<button type="button" class="tbtn" data-act="explain" aria-expanded="false" aria-controls="full" style="margin:10px 0 0 -6px">Explain it</button><div class="ans" id="full" hidden><h3>Full explanation, after the grade</h3><p>'+esc(d.full)+' Explaining it now does not change the grade.</p></div>';
 return h+'<p class="cue">'+esc(d.cue)+'</p>'+backBtn()+'</section>'}

function roomHTML(d){var h='<div class="link"><span>Linked to: <b>orbit-pay</b> · cloud session</span><button type="button" class="tbtn" data-act="back">Back to the build</button></div>';
 h+='<button type="button" class="tbtn back" data-act="inbox">'+BACKCHEV+'Inbox</button>';
 h+='<article class="card" aria-labelledby="qq"><div class="eb">'+esc(d.eb)+' · <span class="mono" style="font-size:12.5px">'+esc(d.id)+'</span></div><div class="lvl">'+esc(d.topic)+' · '+LV[d.level]+'</div><h1 class="qq" id="qq">'+esc(d.q)+'</h1>';
 if(d.kind==='predict'){h+='<div class="cmp">'+saidHTML(d,true)+didHTML(d)+'</div>';if(d.phase==='done')h+=gapHTML()}
 else h+='<div class="cmp one">'+saidHTML(d,true)+'</div>';
 if(d.phase==='wait')h+='<p class="state">Locked. Shown after the test runs.</p><p class="cue">'+esc(d.cue)+'</p>'+backBtn();
 else if(d.phase==='error')h+='<p class="cue">'+esc(d.cue)+'</p>'+backBtn();
 else if(d.offline)h+='<p class="state" role="status">Saved here. The result is shown when you are back online.</p><p class="cue">'+esc(d.cue)+'</p>'+backBtn();
 else h+=verdictHTML(d);

function chatLines(d){var you=d.chatYou||(d.dk?"don't know":d.said+' '+d.conf+'.'),L=[['you',you]];
 if(d.offline)return null;
 if(d.phase==='wait'){L.push(['ag','Locked. Shown after test_retry_budget runs.']);return L}
 if(d.kind==='predict'){L.push(['cmd','$ '+d.cmd]);L.push(['ag','You said: '+d.said+' ('+d.conf.toLowerCase()+')\nIt did: '+d.chatDid+'\n'+d.vw+' '+d.why+' billing/retry.py:22.\nPredictions do not change your record.\n'+d.next+'\n'+d.cue]);return L}
 if(d.saved){L=[['you','Now add a dead letter queue for failed charges.'],['ag','From the Room: idempotency, Correct, now Without help. Back on 10 Nov.\n\nI will add a dead letter queue table and move a charge there when RetryBudgetSpent is raised.']];return L}
 var p=CODE[d.ev[0]].path+':'+d.ev[1],t=d.vw+' '+d.why+' '+p+'. '+d.next;
 if(d.restate)t=d.vw+' '+d.why+' '+p+'. Say it again in one line with that part, or say \'next\'.';
 if(d.belief)t+='\nYou chose Sure. This one returns tomorrow and is marked on your map.';
 if(d.delta.from!==d.delta.to)t+='\nYour record: '+d.delta.topic+' is now '+LV[d.delta.to]+'.';
 L.push(['ag',t+'\n'+d.cue]);return L}
function chatHTML(d){var L=chatLines(d),h='<p class="fn" style="margin-top:4px">The same card in the session transcript. One card, one state, every door.</p><div class="frame" role="region" aria-label="Session transcript, generic frame"><div class="fh"><i></i>session · orbit-pay</div><div class="msgs">';
 if(!L)h+='<p class="msg ag">Chat is the session itself, so it has no offline state. An answer saved on the phone reaches it when the phone is back online.</p>';
 else L.forEach(function(m){h+=m[0]==='cmd'?'<div class="cmd">'+esc(m[1])+'</div>':'<p class="msg '+(m[0]==='you'?'you':'ag')+'"><span class="who">'+(m[0]==='you'?'Sam':'Agent')+'</span>'+esc(m[1])+'</p>'});
 return h+'</div></div>'}

function render(focusV){clear();var s=S[cur],d=s.d,door=$('#door').value;
 $('#st').value=String(cur);$('#offbar').hidden=!d.offline;
 var sim=SIM[s.key];$('#sim').hidden=!sim||door!=='room';if(sim)$('#sim').textContent=sim[0];
 $('#main').innerHTML=door==='chat'?chatHTML(d):roomHTML(d);
 if(door==='room'&&d.delta&&!d.offline&&!d.phase)animateDelta(d.delta);
 if(focusV){var v=$('#vw');if(v)v.focus({preventScroll:false})}
 ui.anim=false;
 try{history.replaceState(null,'','?state='+s.key+(door==='chat'?'&door=chat':''))}catch(e){}}
function go(i,focusV,anim){cur=(i+S.length)%S.length;ui={anim:!!anim};render(focusV)}

 var t=slot.firstChild,tm=setTimeout(function(){slot.innerHTML=''},8000);
 t.addEventListener('mouseenter',function(){clearTimeout(tm)});t.addEventListener('focusin',function(){clearTimeout(tm)});
 t.querySelector('.x').addEventListener('click',function(){slot.innerHTML=''})}

$('#main').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),d=S[cur].d;
 if(a==='ev'||a==='wrote'||a==='explain'){var id=b.getAttribute('aria-controls'),el=document.getElementById(id),open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));el.hidden=!open}
 else if(a==='back'){toast(d.phase==='wait'?'Opening the session. The result is shown there after the test runs.':d.phase==='error'?'Opening the session. Claude shows the result there.':d.offline?'The session opens when you are back online. Your answer is saved here.':'Opening the session. Your next message there starts with this result.')}
 else if(a==='inbox'){toast('In the product this returns to the Inbox. This card has left Now.')}
 else if(a==='skip'){$('#rs').hidden=true;$('#rsout').innerHTML='<p class="re">OK. The grade for this attempt stays Not quite.</p>'}});

 later(function(){var has=/order[ ._-]?id|same (key|on every)/i.test(t);
  out.innerHTML='<p class="re"><b>'+(has?'That has the missing part.':'Still missing: the key must be the same on every attempt, so build it from the order id.')+'</b> Your restatement is part of this attempt, so the grade stays Not quite. '+esc(S[cur].d.next)+'</p>'},RM.matches?300:1200)});

sel.addEventListener('change',function(){go(+sel.value)});

var q=new URLSearchParams(location.search),k=q.get('state');if(q.get('door')==='chat')$('#door').value='chat';
for(var i=0;i<S.length;i++)if(S[i].key===k)cur=i;
render(false);
})();
