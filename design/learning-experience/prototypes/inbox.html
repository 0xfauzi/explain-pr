<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room inbox</title>
<meta name="description" content="Prototype of the Room shell and Inbox: Now, Due and Later, the due cap, toasts after grading, pause, away, offline and error states.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../assets/room.css">
<style>
:root{--tabbar:0px}
*{box-sizing:border-box}
html{scroll-padding:72px 0 calc(var(--tabbar) + 24px)}
body{position:relative;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;background-image:url(../assets/grain.png);background-size:240px 240px;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--ink);text-underline-offset:4px}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype switcher: outside the product, dashed so nobody reads it as product UI */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px auto 0;max-width:1180px;padding:8px 12px;border:1.5px dashed var(--control-border);border-radius:12px;font:500 12px/1.3 var(--mono);color:var(--text-3);width:calc(100% - 32px)}
.proto label{display:flex;align-items:center;gap:8px}
.proto select,.proto button{font:500 12.5px var(--mono);min-height:44px;padding:0 10px;border:1.5px solid var(--control-border);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.proto select#st{max-width:min(320px,58vw)}
.proto .sp{flex:1}
/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;height:56px;padding:0 32px;display:flex;align-items:center;gap:14px}
.word{font-size:19px;font-weight:650;font-variation-settings:"wdth" 88;letter-spacing:-.01em}
.proj{font:500 13px var(--mono);color:var(--text-3)}
.me{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-weight:650;font-size:16px;cursor:pointer}
.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:24px}
.tab{font:600 15px/1 var(--sans);min-height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-3);cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .2s,border-color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tab svg{display:none}
.main{max-width:640px;margin:0 auto;padding:24px 32px 140px;position:relative}
.link{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;font-size:14px;color:var(--text-3);padding:4px 0 18px;border-bottom:1px solid var(--rule)}
.link b{font-weight:500;color:var(--ink)}
.btn{font:600 16px/1 var(--sans);min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#16161A}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink);color:var(--on-ink);transform:none}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;font:600 15px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink)}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:16px;padding:12px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;font-size:15px;line-height:1.5;color:var(--ink)}
.note.strong{border-color:var(--ink)}
.note p{margin:0;flex:1 1 260px}
h1.ph{margin:28px 0 0;font-size:46px;line-height:1.06;letter-spacing:-.02em;font-weight:650;font-variation-settings:"wdth" 88}
.lede{margin:12px 0 0;font-size:17px;line-height:1.6;color:var(--text-2);max-width:560px}
.grp{margin-top:32px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.gh h2{margin:0;font-size:20px;font-weight:650;font-variation-settings:"wdth" 88}
.gh .small{font-size:14px;color:var(--text-3)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1.5px solid var(--border);border-radius:18px;overflow:hidden}
.list li{border-top:1px solid var(--rule);overflow:hidden;max-height:240px}
.list li:first-child{border-top:0}
.list.now{border-left:3px solid var(--accent)}
.ra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;min-height:64px;padding:12px 20px;text-decoration:none;color:var(--ink);transition:background .2s}
.ra:hover{background:color-mix(in srgb,var(--field) 45%,transparent)}
.ra:focus-visible{outline-offset:-4px;border-radius:14px}
.eb{font-size:13px;font-weight:500;color:var(--accent-text)}
.tp{font:500 15px/1.4 var(--mono);overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--text-3);line-height:1.5}
.sub .late{color:var(--ink);font-weight:500}
.rt{display:flex;align-items:center;gap:12px;grid-row:1 / span 3;grid-column:2}
.cost{font:500 12.5px var(--mono);color:var(--text-3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);font:500 12px var(--mono);white-space:nowrap}
.chip.locked{background:var(--ink);color:var(--on-ink)}
.chip.miss{border-color:var(--accent-text);color:var(--accent-text)}
.chip.saved{border-style:dashed}
.leave{animation:leave .25s ease-in forwards}
@keyframes leave{to{opacity:0;max-height:0;min-height:0;padding-top:0;padding-bottom:0}}
.over{margin:12px 2px 0;font-size:14px;color:var(--text-3)}
.cta{margin-top:16px}
.errrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:64px;padding:10px 20px;font-size:15px;color:var(--text-2)}
.errrow p{margin:0;flex:1 1 240px}
.skel{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:12px}
.skel li{height:64px;border-radius:14px;background:var(--field)}
.skel li:nth-child(2){width:86%}
.keys{margin-top:40px;font-size:13px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:8px 16px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border:1.5px solid var(--control-border);border-radius:6px;font:500 12px var(--mono);color:var(--ink);margin-right:4px}
@media (hover:none){.keys,.kc{display:none !important}}
/* empty states: the faint record field behind them, the only place it moves */
.empty{position:relative;margin-top:28px;padding:28px 24px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;z-index:1}
.empty p{margin:0 0 20px;font-size:17px;line-height:1.6;color:var(--text-2)}
.fieldbg{position:absolute;inset:150px 0 auto 30%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:24px 12px;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 60%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 60%,transparent)}
.fc{height:14px;border-radius:3px;background:var(--field)}
.fc.g1{animation:g1 var(--d,9s) ease-in-out infinite}.fc.g2{animation:g2 var(--d,11s) ease-in-out infinite}.fc.g3{animation:g3 var(--d,13s) ease-in-out infinite}
@keyframes g1{0%,70%,100%{background:var(--field)}80%,88%{background:var(--lv1)}}
@keyframes g2{0%,62%,100%{background:var(--field)}74%,86%{background:var(--lv2)}}
@keyframes g3{0%,55%,100%{background:var(--field)}68%,84%{background:var(--accent)}}
/* card view */
.back{margin:8px 0 0 -6px}
.qcard{margin-top:12px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px}
.qcard.isnow{border-left:3px solid var(--accent)}
.qcard.nudge{animation:nudge .3s var(--ease-out)}
@keyframes nudge{50%{transform:translateY(-8px)}}
.qq{margin:6px 0 0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.lvl{font:500 13px var(--mono);color:var(--text-3);margin-top:4px}
details.code{margin-top:16px}
details.code summary{min-height:44px;display:inline-flex;align-items:center;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
pre.ex{margin:8px 0 0;padding:14px 18px;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;font:500 13px/1.8 var(--mono);overflow-x:auto}
pre.ex .hd{display:block;color:var(--text-3)}
pre.ex i{display:inline-block;width:2.4em;color:var(--text-3);font-style:normal}
pre.ex .hl{background:var(--accent-wash)}
label.fl{display:block;margin-top:20px;font-weight:600;font-size:15px}
textarea{display:block;width:100%;margin-top:8px;padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--control-border);border-radius:14px;resize:vertical}
textarea[readonly]{background:var(--paper)}
fieldset{border:0;margin:20px 0 0;padding:0;min-width:0}
legend{font-size:15px;color:var(--text-3);margin-bottom:10px;padding:0}
.confs{display:flex;flex-wrap:wrap;gap:8px}
.sure{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--control-border);color:var(--text-2);font:500 15px var(--sans);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.sure:hover{border-color:var(--ink)}
.sure input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sure:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sure:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
.sure.dk{border-style:dashed;background:transparent}
.sure[aria-disabled="true"],.sure:has(input:disabled){cursor:default}
.mean{margin:8px 0 0;font-size:14px;color:var(--text-3);min-height:22px}
.hints{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.ladder{display:inline-flex;gap:6px;vertical-align:middle;margin-right:10px}
.ladder span{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);font:500 10px/18px var(--mono);text-align:center}
.ladder span.on{background:var(--ink);color:var(--on-ink)}
.nowslot{margin:0;padding:14px 16px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.nowslot p{margin:0;flex:1}
.backto{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.backto .btn{width:100%}
.backto .cue{margin:8px 0 0}
.focus .tabs{display:none !important}
.linkq{font-size:14px;color:var(--text-3);margin:0 0 4px}
.hints ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;line-height:1.5;color:var(--text-2)}
.hints ol b{font:500 12.5px var(--mono);color:var(--ink);margin-right:8px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.acts .grow{flex:1}
.helper{font-size:14px;color:var(--text-3);margin:10px 0 0}
.quiet{font-size:14px;color:var(--text-3);margin:14px 0 0}
.snooze{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.state{margin-top:18px;font-size:16px;line-height:1.6;color:var(--ink)}
.said{margin:16px 0 0;padding:12px 16px;border-left:3px solid var(--border);color:var(--text-2);font-size:16px;line-height:1.5}
.said .chip{margin-left:6px}
.verdict{margin-top:20px;padding:20px 22px;border-radius:14px;background:var(--card);border:1.5px solid var(--border)}
.verdict.in{animation:rise .6s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.vw{margin:0;font-size:26px;font-weight:700;color:var(--accent-text)}
.vw.ok{color:var(--ink)}
.why{margin:8px 0 0;font-size:16px;line-height:1.6;color:var(--text-2)}
.belief{margin:10px 0 0;font-size:15px;line-height:1.6;color:var(--text-3)}
.delta{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 14px;align-items:center;font-size:14px}
.delta .dl{color:var(--text-3)}
.delta .dl b{font:500 13px var(--mono);color:var(--ink);margin-right:6px}
.delta .dl svg{vertical-align:-2px;margin:0 4px}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg{height:14px;border-radius:3px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}
.seg.f1{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f2{background:var(--lv2);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f3{background:var(--lv3);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg.lit{transform:scaleY(1.15)}
.cue{margin:14px 0 0;font:500 13px/1.7 var(--mono);color:var(--text-2)}
.placeholder{margin-top:28px;font-size:17px;color:var(--text-2)}
/* toast and settings */
.toastwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 20px);z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px 14px;width:100%;max-width:576px;padding:8px 8px 8px 18px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:16px;box-shadow:0 8px 24px rgba(22,22,26,.08);animation:rise .3s var(--ease-out) both}
.toast p{margin:0;flex:1}
.toast .x{width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:10px;font-size:20px;line-height:1}
.sheet{position:absolute;right:32px;top:62px;z-index:35;width:min(360px,calc(100vw - 32px));padding:20px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;box-shadow:0 12px 32px rgba(22,22,26,.1)}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:650;font-variation-settings:"wdth" 88}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule);font-size:15px}
.setrow:first-of-type{border-top:0}
.setrow small{display:block;color:var(--text-3);font-size:13px;line-height:1.5;margin-top:2px}
.sw{flex:none;position:relative;width:52px;height:44px;border:0;background:none;cursor:pointer}
.sw::before{content:"";position:absolute;left:0;top:10px;width:52px;height:24px;border-radius:999px;border:1.5px solid var(--control-border);background:var(--card);box-sizing:border-box}
.sw::after{content:"";position:absolute;left:5px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--control-border);transition:transform .2s var(--ease-out)}
.sw[aria-checked="true"]::before{background:var(--ink);border-color:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:var(--on-ink)}
@media (max-width:640px){
:root{--tabbar:calc(64px + env(safe-area-inset-bottom))}
.focus{--tabbar:0px}
.bar{padding:0 16px}
.main{padding:16px 16px calc(var(--tabbar) + 110px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);gap:0;background:var(--paper);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{flex-direction:column;justify-content:center;gap:4px;height:64px;font-size:12px;border-bottom:0;border-top:2px solid transparent}
.tab[aria-current="page"]{border-top-color:var(--accent)}
.tab svg{display:block}
h1.ph{font-size:31px}
.qq{font-size:20px}
.qcard{padding:16px;border-radius:14px}
.ra{padding:12px 16px;gap:4px 10px}
.cost{display:none}
.cta .btn,.acts .btn.lock{width:100%}
.acts .grow{display:none}
.sheet{right:16px}
.proto{gap:6px 8px}.proto .sp{display:none}.proto label[for=st]{flex-basis:100%}.proto select#st{flex:1 1 220px;max-width:none;min-width:0}
.qcard .acts{position:sticky;bottom:calc(var(--tabbar) + 8px);z-index:5;background:var(--card);margin:16px -8px 0;padding:8px;border-radius:14px}
.acts .btn.ghost{flex:1}
.delta{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
.fc,.leave,.qcard.nudge,.verdict.in,.toast{animation:none !important}
.seg,.sw::after,.btn,.tab,.sure{transition:none}
}
</style>
</head>
<body>
<script>if(/[?&]tour=1/.test(location.search))document.documentElement.classList.add("tour")</script>
<div class="proto" role="region" aria-label="Prototype controls">
<label for="st">Prototype state</label>
<button type="button" id="prev" aria-label="Previous state">Prev</button>
<select id="st"></select>
<button type="button" id="next" aria-label="Next state">Next</button>
<span class="sp"></span>
<label>Theme <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
</div>

<header class="top">
<div class="bar">
<span class="word">Room</span><span class="proj">orbit-pay</span>
<button type="button" class="me" id="me" aria-haspopup="true" aria-expanded="false" aria-controls="sheet" aria-label="Sam. Open settings">S</button>
</div>
<nav class="tabs" aria-label="Room">
<button type="button" class="tab" data-tab="inbox" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>Inbox</button>
<button type="button" class="tab" data-tab="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>Map</button>
<button type="button" class="tab" data-tab="drills"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 9h6v7a3 3 0 0 1-6 0z"/><path d="M12 9V6M5 12h4M15 12h4M6 7l3 2M18 7l-3 2M6 19l3-2M18 19l-3-2"/></svg>Drills</button>
<button type="button" class="tab" data-tab="explainers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>Explainers</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings" hidden>
<h2>Settings</h2>
<div class="setrow"><span>Pause reviews for a week<small>Due dates move by the pause. Nothing is lost.</small></span><button type="button" class="sw" role="switch" id="swPause" aria-checked="false" aria-label="Pause reviews for a week"></button></div>
<div class="setrow"><span>Phone reminders<small>At most one a day, at a time you choose. Never while you are at your computer.</small></span><button type="button" class="sw" role="switch" id="swRem" aria-checked="true" aria-label="Phone reminders"></button></div>
<p class="sub" id="saved" role="status" aria-live="polite"></p>
</div>
</header>

<main class="main" id="main" tabindex="-1"></main>
<div class="toastwrap"><div id="toastslot"></div></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var RM=window.matchMedia('(prefers-reduced-motion: reduce)');

 var r=find(S.card), c=CARDS[r.card], a=dk?'':($('#ans').value||'').trim(), conf=dk?'Guess':S.conf;
 S.res[r.card]={a:a||(dk?'I do not know.':''),c:conf,dk:!!dk,saved:!!S.offline};S.draft='';S.conf=null;S.hints=0;
 r.chip=S.offline?'Not sent':'Locked';r.line=S.offline?'Keep this page open until it says Sent.':c.kind==='predict'?'Shown after the test runs.':'Grading…';
 renderCard();var f=$('#qf');if(!RM.matches)f.classList.add('nudge');var st=$('.state');if(st){st.tabIndex=-1;st.focus()}
 if(S.offline||c.kind==='predict')return;
 later(function(){var res=S.res[r.card];res.v=dk?'dk':grade(c,a,conf);r.chip=chipFor(res.v);r.line='';
  if(S.view==='card'&&S.card===r.id){reviewed+=c.kind==='review'?1:0;showVerdict(r,res,true);drop(r.id);S.cardRow=r}
  else leaveRow(r,res.v)},1600);
}
function chipFor(v){return {right:'Correct',partial:'Not quite',wrong:'No',cw:'No · sure',dk:'No'}[v]}
function toastFor(r,v){var c=CARDS[r.card];return {right:'Correct. '+(c.kind==='explain'?'It counts at your review on '+c.next[0]+'.':'Back on '+c.next[0]+'.'),partial:'Not quite. Back tomorrow.',wrong:'No. Back tomorrow.',cw:'No. You chose Sure. Back tomorrow.',dk:'Not known yet. Back tomorrow.'}[v]}
function leaveRow(r,v,sticky){
 if(S.view!=='inbox'||tabNow!=='inbox'){drop(r.id);toast(toastFor(r,v),'Open',function(){openRow(r,true)},sticky);return}
 renderInbox();later(function(){var li=$('[data-row="'+r.id+'"]');var done=function(){drop(r.id);S.cardRow=r;renderInbox();toast(toastFor(r,v),'Open',function(){openRow(r,true)},sticky)};
  if(li&&!RM.matches){li.classList.add('leave');li.addEventListener('animationend',done,{once:true})}else done()},2000);
}
function openRow(r,fromToast){S.view='card';S.card=r.id;S.cardRow=r;S.snz=false;S.conf=null;S.hints=0;S.draft='';S.codeSeen=false;S.ask=false;renderCard();var q=$('#qq');if(q)q.focus()}

/* ---------- status line: stays until dismissed or the next action; no timer ---------- */
var tt=null,tLeft=0,tStart=0;
function toast(msg,label,fn,sticky){
 var slot=$('#toastslot');clearTimeout(tt);
 slot.innerHTML='<div class="toast"><p>'+esc(msg)+'</p>'+(label?'<button type="button" class="btn ghost sm" id="tact">'+esc(label)+'</button>':'')+'<button type="button" class="x" id="tx" aria-label="Dismiss">&times;</button></div>';
 var t=slot.firstChild, close=function(){clearTimeout(tt);slot.innerHTML=''};
 if(label)$('#tact').onclick=function(){close();fn()};$('#tx').onclick=close;
 announce(msg);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var o=e.target.closest('[data-open]');if(o){e.preventDefault();openRow(find(o.dataset.open));return}
 var rt=e.target.closest('[data-retry]');if(rt){var r=find(rt.dataset.retry);var li=rt.closest('li');li.innerHTML='<div class="errrow" aria-busy="true"><p>Loading the question.</p></div>';later(function(){r.err=false;renderInbox()},900);return}
 var sz=e.target.closest('[data-snz]');if(sz){notNow(find(S.card),sz.dataset.snz);return}
 var a=e.target.closest('[data-act]');if(!a)return;var k=a.dataset.act;
 if(k==='inbox'){S.view='inbox';S.snz=false;renderInbox();$('#main').focus()}
 else if(k==='hint'){S.draft=$('#ans').value;S.hints=(S.hints||0)+1;renderCard();announce('Hint '+S.hints+' of 3 shown.');var hb=$('[data-act="hint"]')||$('#ans');hb.focus()}
 else if(k==='dk'){S.draft=$('#ans').value;S.ask=true;renderCard();$('[data-act="dkyes"]').focus()}
 else if(k==='dkyes'){S.ask=false;lock(true)}
 else if(k==='dkno'){S.ask=false;renderCard();$('[data-act="dk"]').focus()}
 else if(k==='undo'){var mv=S.moved;S.moved=null;drop(mv.r.id);mv.r.group=mv.prev.group;mv.r.sub=mv.prev.sub;S[mv.prev.group].unshift(mv.r);renderInbox();var l=$('[data-open="'+mv.r.id+'"]');if(l)l.focus();announce('Back in Now.')}
 else if(k==='notnow'){S.draft=$('#ans').value;S.snz=!S.snz;renderCard();var f=$('[data-snz]')||$('[data-act="notnow"]');f.focus()}
 else if(k==='review'){queue=S.due.filter(function(r){return !r.err}).map(function(r){return r.id});reviewed=0;openRow(find(queue.shift()))}
 else if(k==='nextq'){var nx=queue.shift();if(nx&&find(nx))openRow(find(nx));else{S.view='inbox';renderInbox()}}
 else if(k==='resume'){S.paused=false;$('#swPause').setAttribute('aria-checked','false');S.due=S.due.length?S.due:[D_RB(),D_TF()];renderInbox();announce('Reviews resumed.')}
 else if(k==='retrydb'){S.db=false;S.loading=true;renderInbox();later(function(){S.loading=false;S.now=[NOW()];S.due=[D_RB(),D_TF()];renderInbox()},1100)}
 else if(k==='askone'){a.disabled=true;a.textContent='Asking…';later(function(){S.first=false;S.now=[row('r9','c_3f9c','now','',{cost:'About 1 min'})];renderInbox();var x=$('[data-open]');if(x)x.focus()},900)}
 else if(k==='early'){S.nothing=false;S.due=[row('e1','c_9b08','due','Early',{cost:'About 2 min'})];renderInbox();var y=$('[data-open]');if(y)y.focus()}
 else if(k==='settings')openSheet(true);
 else if(k==='build')toast('This opens the orbit-pay session.');
});
$('#main').addEventListener('change',function(e){if(e.target.name==='conf'){S.conf=e.target.value;S.draft=$('#ans').value;renderCard();var i=$('input[value="'+S.conf+'"]');i.focus()}});
$('#main').addEventListener('submit',function(e){e.preventDefault();if(S.conf)lock(false)});
$('#main').addEventListener('toggle',function(e){var d=e.target;if(!d.classList||!d.classList.contains('code')||!d.open||d.querySelector('summary').nextElementSibling.tagName!=='PRE')return;var r=find(S.card);if(!r||CARDS[r.card].kind==='predict'||S.codeSeen)return;S.codeSeen=true;S.hints=Math.max(1,S.hints||0);announce('Code shown. This attempt now counts as With help.')},true);
function notNow(r,when){var prev={group:r.group,sub:r.sub};var r2=r;r2.group='later';r2.sub=when;
 drop(r.id);S.later.unshift(r2);S.view='inbox';S.snz=false;S.moved=prev.group==='now'?{r:r2,prev:prev}:null;renderInbox();
 if(S.moved)$('#nowslot').focus();else{$('#main').focus();toast('Moved to Later.','Undo',function(){drop(r2.id);r2.group=prev.group;r2.sub=prev.sub;S[prev.group].unshift(r2);renderInbox();var l=$('[data-open="'+r2.id+'"]');if(l)l.focus()})}}
function announce(t){var s=$('#saved');s.textContent='';setTimeout(function(){s.textContent=t},30)}
function openSheet(on){var sh=$('#sheet'),me=$('#me');sh.hidden=!on;me.setAttribute('aria-expanded',String(on));if(on)$('#swPause').focus();else me.focus()}
$('#me').onclick=function(){openSheet($('#sheet').hidden)};
$('#swPause').onclick=function(){var on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',String(on));S.paused=on;$('#saved').textContent='Saved.';if(S.view==='inbox')renderInbox()};
$('#swRem').onclick=function(){var on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',String(on));S.remOff=!on;$('#saved').textContent='Saved.';if(S.view==='inbox')renderInbox()};
document.addEventListener('click',function(e){var sh=$('#sheet');if(!sh.hidden&&!sh.contains(e.target)&&e.target!==$('#me')&&!e.target.closest('[data-act="settings"]'))openSheet(false)},true);
$$('.tab').forEach(function(t){t.onclick=function(){$$('.tab').forEach(function(x){x.removeAttribute('aria-current')});t.setAttribute('aria-current','page');tabNow=t.dataset.tab;
 if(tabNow==='inbox'){S.view='inbox';renderInbox()}else{var n=t.textContent.trim();$('#main').innerHTML=shellTop()+'<h1 class="ph">'+n+'</h1><p class="placeholder">This prototype shows the Inbox. '+n+' has its own prototype: <a href="'+{map:'map.html',drills:'drill.html',explainers:'explainer.html'}[tabNow]+'">'+n+' prototype</a>.</p>'}}});
var gPending=false;
document.addEventListener('keydown',function(e){
 var tag=(e.target.tagName||'').toLowerCase(),typing=tag==='textarea'||tag==='input'&&e.target.type==='text'||tag==='select';
 if(e.key==='Escape'){if(!$('#sheet').hidden){openSheet(false);return}if(S.view==='card'){S.view='inbox';renderInbox();$('#main').focus()}return}
 if(S.view==='card'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(S.conf&&$('#ans'))lock(false);return}
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='['||e.key===']'){step(e.key===']'?1:-1);return}
 if(S.view==='card'&&$('#ans')){var m={'1':'Guess','2':'Fairly sure','3':'Sure'}[e.key];if(m){S.conf=m;S.draft=$('#ans').value;renderCard();$('input[value="'+m+'"]').focus();return}
  if(e.key==='d'||e.key==='D'){$('[data-act="dk"]').click();return}if(e.key==='h'||e.key==='H'){$('[data-act="notnow"]').click();return}}
 if(S.view==='inbox'){var rows=$$('[data-open]'),i=rows.indexOf(document.activeElement);
  if(e.key==='j'||e.key==='k'){e.preventDefault();if(!rows.length)return;i=e.key==='j'?Math.min(rows.length-1,i+1):Math.max(0,i<0?0:i-1);rows[i].focus()}
  else if((e.key==='h'||e.key==='H')&&i>=0){var r=find(rows[i].dataset.open);if(r.group!=='later')notNow(r,'After this build')}
  else if(e.key==='g')gPending=true,setTimeout(function(){gPending=false},800);
  else if(e.key==='m'&&gPending)$('[data-tab="map"]').click();
  else if(e.key==='?')toast('J and K move. Enter opens. H moves a row to Later. G then M opens the Map.')}
});

/* ---------- prototype switcher ---------- */
var sel=$('#st');STATES.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s[0];sel.appendChild(o)});
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function apply(i){clearTimeout(tt);clearTimers();$('#toastslot').innerHTML='';queue=[];reviewed=0;S=fresh();S.view='inbox';STATES[i][1]();sel.value=i;tabNow='inbox';
 $$('.tab').forEach(function(x){x.removeAttribute('aria-current');if(x.dataset.tab==='inbox')x.setAttribute('aria-current','page')});
 $('#swPause').setAttribute('aria-checked',String(!!S.paused));$('#swRem').setAttribute('aria-checked',String(!S.remOff));$('#saved').textContent='';
 try{history.replaceState(null,'','?state='+slug(STATES[i][0]))}catch(err){}
 renderInbox();
 if(S.demo){var r=S.now[0],res=S.res[r.card];res.v=S.demo;later(function(){r.chip=chipFor(S.demo);r.line='';leaveRow(r,S.demo,true)},700)}
}
function step(d){apply((+sel.value+d+STATES.length)%STATES.length)}
sel.onchange=function(){apply(+sel.value)};$('#prev').onclick=function(){step(-1)};$('#next').onclick=function(){step(1)};
var th=$('#theme');try{th.value=localStorage.getItem('room-theme')||''}catch(err){}
function setTheme(){if(th.value)document.documentElement.setAttribute('data-theme',th.value);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('room-theme',th.value)}catch(err){}}
th.onchange=setTheme;setTheme();
var q=new URLSearchParams(location.search).get('state'),start=3;
STATES.forEach(function(s,i){if(q&&(slug(s[0])===q||String(i+1)===q))start=i});
apply(start);
})();
</script>
