<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map and growth</title>
<meta name="description" content="Prototype of the Room Map: weakest now, changed since, the record grid with outlines, glyphs and best-versus-latest rings, the table view, the topic sheet, calibration, practice days and the Growth view for the end of a project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../assets/room.css">
<style>
:root{--tabbar:0px}
*{box-sizing:border-box}
html{scroll-padding:110px 0 calc(var(--tabbar) + 24px)}
body{position:relative;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;background-image:url(../assets/grain.png);background-size:240px 240px;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
a{color:var(--ink);text-underline-offset:4px}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype switcher: outside the product, dashed so nobody reads it as product UI */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px auto 0;max-width:1180px;padding:8px 12px;border:1.5px dashed var(--control-border);border-radius:12px;font:500 12px/1.3 var(--mono);color:var(--text-3);width:calc(100% - 32px)}
.proto label{display:flex;align-items:center;gap:8px}
.proto select,.proto button{font:500 12.5px var(--mono);min-height:44px;padding:0 10px;border:1.5px solid var(--control-border);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.proto select#st{max-width:min(340px,58vw)}
.proto .sp{flex:1}
/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;height:56px;padding:0 32px;display:flex;align-items:center;gap:14px}
.word{font-size:19px;font-weight:650;font-variation-settings:"wdth" 88;letter-spacing:-.01em}
.proj{font:500 13px var(--mono);color:var(--text-3)}
.me{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-weight:650;font-size:16px}
.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:24px}
.tab{font:600 15px/1 var(--sans);min-height:44px;padding:0 4px;border-bottom:2px solid transparent;color:var(--text-3);display:flex;align-items:center;gap:8px;text-decoration:none;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tab svg{display:none}
.main{max-width:960px;margin:0 auto;padding:20px 32px 140px;position:relative}
.link{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;font-size:14px;color:var(--text-3);padding:0 0 12px;border-bottom:1px solid var(--rule)}
.link b{font-weight:500;color:var(--ink)}
.btn{font:600 16px/1 var(--sans);min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#16161A}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink);color:var(--on-ink);transform:none}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;font:600 15px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink)}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:16px;padding:12px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;font-size:15px;line-height:1.5}
.note.strong{border-color:var(--ink)}
.note p{margin:0;flex:1 1 260px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 24px;margin-top:24px}
h1.ph{margin:0;font-size:46px;line-height:1.06;letter-spacing:-.02em;font-weight:650;font-variation-settings:"wdth" 88}
.lede{margin:10px 0 0;font-size:17px;line-height:1.6;color:var(--text-2);max-width:560px}
.ctrls{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.toggle{background:var(--paper);display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.tg{font:600 14px/1 var(--sans);min-height:44px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,color .25s}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
h2.st{margin:0;font-size:24px;line-height:1.3;font-weight:650;font-variation-settings:"wdth" 88}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px}
.weak{margin-top:24px;border-color:var(--ink)}
.weak .wt{margin:0;font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.01em}
.weak .wt .mono{font-size:.85em;font-weight:500}
.weak .sub{margin:6px 0 0}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.sub{font-size:14px;color:var(--text-3);line-height:1.6}
.lines{margin:16px 0 0;padding:0;list-style:none;font-size:16px;line-height:1.6;color:var(--text-2)}
.lines li{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;padding:6px 0;border-top:1px solid var(--rule)}
.lines li:first-child{border-top:0}
.lines b{font-weight:600;color:var(--ink)}
.tp{font:500 .9em var(--mono);color:var(--ink)}
/* record panel, as on the site */
.panel{margin-top:24px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px 24px 18px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.dims{list-style:none;margin:12px 0 0;padding:0}
.dims>li{border-top:1px solid var(--rule)}
.row,.rowbtn{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 150px 28px;gap:14px;align-items:center;width:100%;min-height:48px;padding:6px 0;text-align:left;background:none;border:0;font:inherit;color:var(--ink)}
.rowbtn{cursor:pointer;border-radius:10px}
.rowbtn:hover .nm{text-decoration:underline;text-underline-offset:4px}
.nm{font-size:15px;font-weight:500}
.lv{font:500 12px var(--mono);text-align:right;color:var(--text-2)}
.lv.l0{color:var(--text-4)}.lv.l3{color:var(--accent-text)}
.chev{justify-self:end;transition:transform .25s var(--ease-out)}
.rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg{height:14px;border-radius:3px;background:var(--lv0);transition:background-color .55s ease,transform .55s var(--ease-spring)}
.seg.f1{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f2{background:var(--lv2);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f3{background:var(--lv3);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg[class*=" f"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rise .seg[class*=" f"]{animation:segin .55s var(--ease-spring) both}
@keyframes segin{from{background:var(--lv0);transform:scaleY(1);box-shadow:none}60%{transform:scaleY(1.15)}}
.nonote{grid-column:1 / -1;margin:-6px 0 8px;font-size:14px;color:var(--text-3)}
.tcells{list-style:none;margin:0;padding:4px 0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}
.cell{display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;width:100%;min-height:56px;padding:4px 8px 4px 0;background:none;border:0;border-radius:12px;text-align:left;cursor:pointer}
.cell:hover{background:color-mix(in srgb,var(--field) 55%,transparent)}
.cell .cn{grid-column:2;font:500 13px/1.3 var(--mono);overflow-wrap:anywhere}
.cell .cl{grid-column:2;font-size:12.5px;color:var(--text-3)}
.sq{grid-row:1 / span 2;justify-self:center;position:relative;width:28px;height:28px;border-radius:6px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}
.sq.l1{background:var(--lv1)}.sq.l2{background:var(--lv2)}.sq.l3{background:var(--lv3)}
.sq.l1,.sq.l2,.sq.l3{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sq.l0{box-shadow:inset 0 0 0 1.5px var(--control-border)}
.sq.ring{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.sq .gl{position:absolute;left:6px;bottom:5px;display:flex;gap:2px;align-items:end}
.sq .gl i{display:block;width:2px;height:9px;background:#16161A;border-radius:1px}
.sq.l3 .gl i{background:#F5F4F0}
.sq.miss::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--card)}
.sq.lit{animation:lit .5s var(--ease-spring)}
@keyframes lit{from{background:var(--lv0)}50%{transform:scaleY(1.15)}}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px;margin-top:10px;padding-top:14px;border-top:1px solid var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--text-3);margin:0;padding:0;list-style:none}
.legend li{display:inline-flex;align-items:center;gap:8px}
.legend .sq{width:14px;height:14px;border-radius:3px}
.legend .sq .gl{display:none}
.count{font-size:14px;font-weight:650}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:24px}
.cal{display:grid;gap:12px;margin:16px 0 0;padding:0;list-style:none}
.cal li{display:grid;grid-template-columns:96px minmax(0,1fr) 104px;gap:4px 12px;align-items:center;font-size:14px}
.cal .tr{position:relative;height:12px;border-radius:5px;background:var(--field)}
.cal .tr .fill{display:block;height:100%;background:var(--ink);border-radius:5px;transform-origin:left;transition:transform .6s var(--ease-out)}
.cal .tr .band{position:absolute;top:-4px;bottom:-4px;border:1.5px dashed var(--accent-text);border-radius:5px}
.misses{margin:12px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.6;color:var(--text-2)}
.misses li{padding:4px 0;border-top:1px solid var(--rule)}
.qtxt{font-size:14px;color:var(--text-3)}
.qtxt button{font:inherit;min-height:44px;padding:0 4px;border:0;background:none;color:var(--text-3);cursor:pointer;text-underline-offset:4px}
.qtxt button[aria-pressed="true"]{color:var(--ink);text-decoration:underline}
.sgl{font-weight:600;font-size:15px}
.cal .fr{font:500 12.5px var(--mono);color:var(--text-2);text-align:right}
.weeks{display:grid;grid-template-columns:repeat(7,12px);gap:6px;margin-top:16px}
.wk{width:12px;height:12px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-3)}
.wk.on{background:var(--ink);box-shadow:none}
.wk.today{outline:1.5px solid var(--text-dim);outline-offset:2px}
/* table */
.tw{margin-top:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-weight:600;text-align:left;color:var(--text-3);font-size:12.5px;padding:8px 10px 8px 0;border-bottom:1.5px solid var(--border)}
td{padding:4px 10px 4px 0;border-bottom:1px solid var(--rule);color:var(--text-2)}
td .tbtn{font:500 13px var(--mono);padding:0;text-align:left}
tr.grp td{font-weight:650;color:var(--ink);padding-top:14px}
/* skeleton and empty */
.skel .seg,.skel .nm{background:var(--field)}
.skel .nm{display:block;height:14px;border-radius:3px;width:60%}
.empty{position:relative;z-index:1}
.fieldbg{position:absolute;inset:200px 0 auto 30%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:24px 12px;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 60%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 60%,transparent)}
.fc{height:14px;border-radius:3px;background:var(--field)}
.fc.g1{animation:g1 var(--d,9s) ease-in-out infinite}.fc.g2{animation:g2 var(--d,11s) ease-in-out infinite}.fc.g3{animation:g3 var(--d,13s) ease-in-out infinite}
@keyframes g1{0%,70%,100%{background:var(--field)}80%,88%{background:var(--lv1)}}
@keyframes g2{0%,62%,100%{background:var(--field)}74%,86%{background:var(--lv2)}}
@keyframes g3{0%,55%,100%{background:var(--field)}68%,84%{background:var(--accent)}}
.panel.faint{opacity:.9}
/* growth */
.gsum{margin:12px 0 0;font-size:17px;line-height:1.6;color:var(--text-2)}
.gsum b{color:var(--ink);font-weight:600}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panels .panel .row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 108px;min-height:40px}
.drop{margin-top:16px;padding:14px 18px;background:var(--card);border:1.5px solid var(--border);border-left:3px solid var(--ink);border-radius:14px;font-size:16px;line-height:1.6}
.drop p{margin:0}
.drop.hl{border-color:var(--ink);border-left-color:var(--accent)}
.tl{margin-top:16px}
.trk{display:grid;grid-template-columns:190px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}
.trk h3{margin:0;font-size:15px;font-weight:500}
.line{position:relative;height:20px}
.line::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--border)}
.dot{position:absolute;top:5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--lv0);box-shadow:0 0 0 1.5px var(--ink)}
.dot.l1{background:var(--lv1)}.dot.l2{background:var(--lv2)}.dot.l3{background:var(--lv3)}
.dot.miss{background:var(--card);box-shadow:0 0 0 1.5px var(--ink),0 0 0 3px var(--card),0 0 0 4.5px var(--ink)}
.dot.hl{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-wash)}
.chg{grid-column:2;margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--text-3)}
.tlist{grid-column:1 / -1;margin:0;padding:0;list-style:none}
.tlist li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;color:var(--text-2)}
.axis{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px}
.ax{position:relative;height:20px;font:500 11.5px var(--mono);color:var(--text-3)}
.ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ev{margin:12px 0 0;padding:0;list-style:none;font:500 13px/1.7 var(--mono);color:var(--text-2)}
.ev li{padding:6px 0;border-top:1px solid var(--rule);overflow-wrap:anywhere}
.ev b{color:var(--ink);font-weight:500}
/* topic sheet: a non-modal dialog; focus is never trapped */
dialog.sheet::backdrop{background:rgba(22,22,26,.18)}
dialog.sheet{position:fixed;inset:0 0 0 auto;margin:0;width:min(460px,100vw);height:auto;max-height:none;padding:24px 24px 120px;border:0;border-left:1.5px solid var(--border);background:var(--card);color:var(--ink);overflow-y:auto;z-index:45;box-shadow:-12px 0 32px rgba(22,22,26,.08)}
dialog.sheet[open]{animation:slide .3s var(--ease-out)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.sheet .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;border-radius:10px;font-size:22px;cursor:pointer;color:var(--ink)}
.sheet h2{margin:0;padding-right:44px;font-size:22px;line-height:1.3;font-weight:650;font-variation-settings:"wdth" 88;overflow-wrap:anywhere}
.sheet h2 .mono{font-size:.8em;font-weight:500}
.facts{margin:12px 0 0;font-size:15px;line-height:1.7;color:var(--text-2)}
.facts p{margin:0}
.hist{list-style:none;margin:12px 0 0;padding:0 0 0 6px;border-left:2px solid var(--border)}
.hist li{position:relative;padding:8px 0 10px 20px;font-size:14px;line-height:1.5;color:var(--text-2)}
.hist li .dot{left:-1px;top:13px}
.hist b{color:var(--ink);font-weight:600}
.said{display:block;margin-top:4px;font:500 12.5px/1.6 var(--mono);color:var(--text-3)}
h3.sh{margin:28px 0 0;font-size:17px;font-weight:650}
.rv{margin-top:20px;padding:18px;border:1.5px solid var(--border);border-left:3px solid var(--accent);border-radius:14px}
.rv.nudge{animation:nudge .3s var(--ease-out)}
@keyframes nudge{50%{transform:translateY(-8px)}}
.eb{margin:0;font-size:13px;font-weight:500;color:var(--accent-text)}
.qq{margin:6px 0 0;font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
label.fl{display:block;margin-top:16px;font-weight:600;font-size:15px}
textarea{display:block;width:100%;margin-top:8px;padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--control-border);border-radius:14px;resize:vertical}
textarea[readonly]{background:var(--paper)}
fieldset{border:0;margin:16px 0 0;padding:0;min-width:0}
legend{font-size:15px;color:var(--text-3);margin-bottom:10px;padding:0}
.confs{display:flex;flex-wrap:wrap;gap:8px}
.sure{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--control-border);color:var(--text-2);font:500 15px var(--sans);cursor:pointer;background:transparent;transition:border-color .2s,background .2s,color .2s}
.sure:hover{border-color:var(--ink)}
.sure input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sure:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sure:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
.sure.dk{border-style:dashed}
.mean{margin:8px 0 0;font-size:14px;color:var(--text-3);min-height:22px}
.hints{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px;color:var(--text-3)}
.ladder{display:inline-flex;gap:6px;vertical-align:middle;margin-right:8px}
.ladder span{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);font:500 10px/18px var(--mono);text-align:center}
.ladder span.on{background:var(--ink);color:var(--on-ink)}
.hints ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;line-height:1.5;color:var(--text-2)}
.hints ol b{font:500 12.5px var(--mono);color:var(--ink);margin-right:8px}
.verdict{margin-top:16px}
.verdict h4{margin:0;font-size:26px;font-weight:700;color:var(--accent-text)}
.verdict h4.ok{color:var(--ink)}
.verdict p{margin:8px 0 0;font-size:16px;line-height:1.6;color:var(--text-2)}
.verdict .path{font:500 13px var(--mono);color:var(--ink)}
.delta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px}
.cue{margin:12px 0 0;font:500 13px/1.7 var(--mono);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);font:500 12px var(--mono);white-space:nowrap}
.chip.saved{border-style:dashed}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 20px);z-index:50;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px 14px;width:100%;max-width:560px;padding:8px 8px 8px 18px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:15px;animation:rise .3s var(--ease-out) both}
.toast p{margin:0;flex:1}
