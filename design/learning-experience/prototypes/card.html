<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question card</title>
<meta name="description" content="Prototype of the Room question card: every kind and answer shape, confidence with meanings, I do not know, Not now, the hint ladder, the action bar, and the locked, grading, offline and error states.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../assets/room.css">
<style>
:root{--tabbar:0px;--abar:0px}
*{box-sizing:border-box}
html{scroll-padding:72px 0 calc(var(--tabbar) + var(--abar) + 24px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background-image:url(../assets/grain.png);background-size:240px 240px;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--ink);text-underline-offset:4px}
button,input,textarea{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype controls: outside the product, dashed so nobody reads them as product UI */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px auto 0;max-width:1180px;padding:8px 12px;border:1.5px dashed var(--control-border);border-radius:12px;font:500 12px/1.3 var(--mono);color:var(--text-3);width:calc(100% - 32px)}
.proto label{display:flex;align-items:center;gap:8px}
.proto select,.proto button{font:500 12.5px var(--mono);min-height:44px;padding:0 10px;border:1.5px solid var(--control-border);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%;cursor:pointer}
.proto select#st{max-width:min(360px,58vw)}
.proto input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.proto .ck{min-height:44px}
.proto .sp{flex:1}
.embed .proto,.embed .rail{display:none}
.vpwrap{display:flex;justify-content:center;padding:24px 16px 48px}
.vpwrap iframe{border:1.5px solid var(--control-border);border-radius:28px;background:var(--paper);height:820px;max-width:100%}
/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;height:56px;padding:0 32px;display:flex;align-items:center;gap:14px}
.word{font-size:19px;font-weight:650;font-variation-settings:"wdth" 88;letter-spacing:-.01em}
.proj{font:500 13px var(--mono);color:var(--text-3)}
.me{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-weight:650;font-size:16px;cursor:pointer}
.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:24px}
.tab{font:600 15px/1 var(--sans);min-height:44px;padding:0 4px;border-bottom:2px solid transparent;color:var(--text-3);display:flex;align-items:center;gap:8px;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tab svg{display:none}
.layout{max-width:1180px;margin:0 auto;padding:16px 32px 140px;display:grid;grid-template-columns:minmax(0,640px);justify-content:center;gap:32px}
@media (min-width:1100px){.layout{grid-template-columns:minmax(0,640px) 300px;gap:56px}.rail{position:sticky;top:120px;align-self:start}}
.link{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 16px;font-size:14px;color:var(--text-3);border-bottom:1px solid var(--rule)}
.link b{font-weight:500;color:var(--ink)}
.btn{font:600 16px/1 var(--sans);min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#16161A}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 18px}
.btn[aria-disabled="true"],.btn[aria-disabled="true"]:hover{background:var(--field);border-color:var(--field);color:var(--text-3);cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;font:600 15px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border:1.5px solid currentColor;border-radius:6px;font:500 12px var(--mono);opacity:.8}
@media (hover:none){.kc{display:none !important}}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:16px;padding:12px 16px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:15px;line-height:1.5}
.note p{margin:0;flex:1 1 260px}
/* the card */
.qcard{margin-top:16px;background:var(--card);border:1.5px solid var(--border);border-left:3px solid var(--accent);border-radius:18px;padding:24px 24px 0}
.qcard.nudge{animation:nudge .3s var(--ease-out)}
@keyframes nudge{50%{transform:translateY(-8px)}}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eb{font-size:13px;font-weight:500;color:var(--accent-text)}
.lvl{font:500 13px var(--mono);color:var(--text-3);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);font:500 12px var(--mono);white-space:nowrap}
.chip.locked{background:var(--ink);color:var(--on-ink)}
.chip.miss{border-color:var(--accent-text);color:var(--accent-text)}
.chip.saved{border-style:dashed}
.qq{margin:12px 0 0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em;text-wrap:pretty}
.ex{margin:16px 0 0;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.ex .hd{display:block;padding:10px 18px 0;font:500 12.5px var(--mono);color:var(--text-3)}
.ex pre{margin:0;padding:6px 0 12px;font:500 13px/1.8 var(--mono);overflow-x:auto}
.ex .ln{display:block;padding:0 18px;white-space:pre}
.ex .ln.hl{background:var(--accent-wash)}
.ex i{display:inline-block;width:2.4em;color:var(--text-dim);font-style:normal}
details.code{margin-top:14px}
details.code summary{min-height:44px;display:inline-flex;align-items:center;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.fl{display:block;margin-top:20px;font-weight:600;font-size:15px}
textarea,.other{display:block;width:100%;margin-top:8px;padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--control-border);border-radius:14px}
textarea{resize:vertical;min-height:120px}
textarea[readonly]{background:var(--paper)}
fieldset{border:0;margin:20px 0 0;padding:0;min-width:0}
legend{font-size:15px;font-weight:600;margin-bottom:8px;padding:0}
/* choice */
.opts{border-bottom:1px solid var(--border)}
.opt{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;min-height:56px;padding:12px 4px;border-top:1px solid var(--border);font:500 18px/1.4 var(--sans);cursor:pointer;transition:padding .2s}
.opt:hover{padding-left:12px}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt .k{font:500 13px/1 var(--mono);color:var(--text-3)}
.opt:has(input:checked){font-weight:650}
.opt:has(input:checked) .k{color:var(--accent-text)}
.opt:has(input:checked)::after{content:"";position:absolute;right:6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--ink)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
/* line pick */
.pick{margin-top:8px;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;overflow-x:auto;padding:6px 0}
.pick .hd{display:block;padding:4px 16px 6px;font:500 12.5px var(--mono);color:var(--text-3)}
.pl{position:relative;display:flex;align-items:center;min-height:44px;padding:0 16px 0 13px;border-left:3px solid transparent;font:500 13px var(--mono);white-space:pre;cursor:pointer;min-width:max-content}
.pl:hover{background:color-mix(in srgb,var(--field) 60%,transparent)}
.pl input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pl i{display:inline-block;width:2.4em;color:var(--text-dim);font-style:normal}
.pl:has(input:checked){background:var(--accent-wash);border-left-color:var(--ink)}
.pl:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
/* order */
.ord{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--border)}
.ord li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:60px;padding:8px 0;border-bottom:1px solid var(--border);font-size:16px;line-height:1.45}
.ord li.moved{animation:moved .7s var(--ease-out)}
@keyframes moved{from{background:var(--accent-wash)}}
.ord .n{font:500 13px var(--mono);color:var(--text-3)}
.mv{display:flex;gap:4px}
.mv button{width:44px;height:44px;border:1.5px solid var(--control-border);border-radius:12px;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mv button:hover{border-color:var(--ink)}
.mv button[disabled]{opacity:.35;cursor:default}
/* confidence */
.confs{display:flex;flex-wrap:wrap;gap:8px}
.sure{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--control-border);color:var(--text-2);font:500 15px var(--sans);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.sure:hover{border-color:var(--ink)}
.sure input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sure:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sure:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
.sure .kc{margin-left:8px;min-width:18px;height:18px;font-size:11px}
.mean{margin:8px 0 0;font-size:14px;color:var(--text-3);min-height:22px}
.mean b{font-weight:600;color:var(--ink)}
/* hints */
.hints{margin-top:20px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:14px;color:var(--text-3)}
.ladder{display:inline-grid;grid-template-columns:repeat(3,28px);gap:4px;vertical-align:middle;margin-right:10px}
.ladder span{height:10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--ink);transition:background .4s var(--ease-out)}
.ladder span.on{background:var(--ink)}
.hints ol{flex:1 1 100%;margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;line-height:1.5;color:var(--text-2)}
.hints ol li{padding:10px 14px;background:var(--paper);border-radius:10px}
.hints ol li.in{animation:rise .5s var(--ease-out) both}
.hints ol b{font:500 12.5px var(--mono);color:var(--ink);margin-right:8px}
.hints .cap{flex:1 1 100%;margin:0;color:var(--ink)}
details.more summary{list-style:none;min-height:44px;display:inline-flex;align-items:center;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
details.more summary::-webkit-details-marker{display:none}
/* action bar */
.quiet{font-size:14px;color:var(--text-3);margin:14px 0 0}
.abar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"why acts" "help lock" "snz snz";align-items:center;gap:10px 16px;margin:20px -24px 0;padding:14px 24px;border-top:1px solid var(--rule);background:var(--card);border-radius:0 0 18px 18px}
.abar .why2{grid-area:why;font-size:13px;color:var(--text-3);min-width:0}
.abar .row2{grid-area:acts;justify-content:flex-end}.abar .lock{grid-area:lock;justify-self:end}.abar .helper{grid-area:help}.abar .snooze{grid-area:snz}
.abar .row2{display:flex;gap:10px}
.abar .pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--control-border);background:transparent;font:500 15px var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.abar .pill:hover{border-color:var(--ink)}
.abar .pill.dk{border-style:dashed}
.abar .pill[aria-expanded="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.helper{margin:0;font-size:14px;color:var(--text-3)}
.helper.warn{color:var(--ink);font-weight:500}
.snooze{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end}
.snooze span{font-size:14px;color:var(--text-3);margin-right:4px}
/* after lock */
.state{margin:20px 0 0;font-size:16px;line-height:1.6}
.state b{font-weight:650}
.said{margin:16px 0 0;padding:12px 16px;border-left:3px solid var(--border);color:var(--text-2);font-size:16px;line-height:1.5}
.said .cap{display:block;font-size:13px;color:var(--text-3);margin-bottom:4px}
.said .chip{margin-left:6px;vertical-align:1px}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.verdict{margin:20px 0 0;padding:20px 22px;border-radius:14px;background:var(--paper);border:1.5px solid var(--border)}
.verdict.in{animation:rise .6s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.vw{margin:0;font-size:26px;font-weight:700;color:var(--accent-text);outline-offset:6px}
.vw.ok{color:var(--ink)}
.why{margin:8px 0 0;font-size:16px;line-height:1.6;color:var(--text-2)}
.belief{margin:10px 0 0;font-size:15px;line-height:1.6;color:var(--text-3)}
.delta{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 14px;align-items:center;font-size:14px;color:var(--text-3)}
.delta b{font:500 13px var(--mono);color:var(--ink);margin-right:6px}
.delta svg{vertical-align:-2px;margin:0 4px}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg{height:14px;border-radius:3px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}
.seg.f1{background:var(--lv1);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f2{background:var(--lv2);box-shadow:inset 0 0 0 1.5px var(--ink)}.seg.f3{background:var(--lv3);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg.lit{transform:scaleY(1.15)}
.cue{margin:14px 0 0;font:500 13px/1.7 var(--mono);color:var(--text-2)}
.done{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px -24px 0;padding:14px 24px;border-top:1px solid var(--rule)}
.tail{height:24px}
/* skeleton */
.sk{display:block;border-radius:6px;background:var(--field)}
/* inbox stub after Not now */
.gh{margin:28px 0 10px;font-size:20px;font-weight:650;font-variation-settings:"wdth" 88}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1.5px solid var(--border);border-radius:18px;overflow:hidden}
.ra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;min-height:64px;padding:12px 20px;text-decoration:none;color:var(--ink)}
.ra:hover{background:color-mix(in srgb,var(--field) 45%,transparent)}
.ra .rt{grid-row:1 / span 3;grid-column:2}
.tp{font:500 15px/1.4 var(--mono)}
.sub{font-size:14px;color:var(--text-3)}
.empty{margin:0;font-size:16px;color:var(--text-2)}
/* prototype rail */
.rail{padding:16px 18px;border:1.5px dashed var(--control-border);border-radius:14px;font-size:14px;line-height:1.6;color:var(--text-2)}
.rail h2{margin:0 0 6px;font:500 12px var(--mono);color:var(--text-3)}
.rail p{margin:0 0 10px}
.rail pre{margin:0;font:500 12px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-3)}
/* toast */
.toastwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 20px);z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px 14px;width:100%;max-width:576px;padding:8px 8px 8px 18px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;font-size:16px;box-shadow:0 8px 24px rgba(22,22,26,.08);animation:rise .3s var(--ease-out) both}
.toast p{margin:0;flex:1}
.toast .x{width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:10px;font-size:20px;line-height:1}
@media (max-width:640px){
:root{--tabbar:calc(64px + env(safe-area-inset-bottom));--abar:120px}
.bar{padding:0 16px}
.layout{padding:12px 16px calc(var(--tabbar) + 32px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);gap:0;background:var(--paper);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{flex-direction:column;justify-content:center;gap:4px;height:64px;font-size:12px;border-bottom:0;border-top:2px solid transparent}
.tab[aria-current="page"]{border-top-color:var(--accent)}
.tab svg{display:block}
.qcard{padding:16px 16px 0;border-radius:14px}
.qq{font-size:20px}
.vw{font-size:22px}
.opt{font-size:17px}
.abar{position:sticky;bottom:var(--tabbar);z-index:20;margin:20px -16px 0;padding:12px 16px;border-radius:0 0 14px 14px;box-shadow:0 -10px 20px -14px rgba(22,22,26,.25);grid-template-columns:minmax(0,1fr);grid-template-areas:"snz" "acts" "lock" "help";gap:8px}
.abar .lock{justify-self:stretch}
.abar .why2,.abar .kc{display:none}
.abar .pill{white-space:nowrap;padding:0 12px}
.abar .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abar .btn{width:100%}
.snooze{justify-content:flex-start}
.proto{gap:4px 8px}.proto .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.done{margin:20px -16px 0;padding:14px 16px}
.done .btn{width:100%}
.delta{grid-template-columns:minmax(0,1fr)}
.ra{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){
.qcard.nudge,.verdict.in,.toast,.ord li.moved,.hints ol li.in,.dots::after{animation:none !important}
.seg,.ladder span,.btn,.sure,.opt{transition:none}
.dots::after{content:"..."}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Prototype controls">
<label for="st" class="lbl">Prototype state</label>
<button type="button" id="prev" aria-label="Previous state">[</button>
<select id="st"></select>
<button type="button" id="next" aria-label="Next state">]</button>
<span class="sp"></span>
<label class="ck"><input type="checkbox" id="net"> Offline</label>
<label>Width <select id="vw"><option value="">Fit</option><option value="390">390</option><option value="768">768</option></select></label>
<label>Theme <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
</div>
<div class="vpwrap" id="vpwrap" hidden><iframe id="vpf" title="The card at the chosen width"></iframe></div>

<div id="app">
<header class="top">
<div class="bar">
<span class="word">Room</span><span class="proj">orbit-pay</span>
<button type="button" class="me" data-act="settings" aria-label="Sam. Open settings">S</button>
</div>
<nav class="tabs" aria-label="Room">

  h='<h2 class="vw'+(w==='right'?' ok':'')+'" id="vh" tabindex="-1">'+word+'</h2><p class="why">'+esc(why)+' '+nx+'</p>';
  if(w==='cw')h+='<p class="belief">You chose Sure. This is the kind of error that is easiest to fix when you see the reason. It returns tomorrow.</p>';
  if(w==='right'&&S.hints)h+='<p class="belief">You used a hint, so this attempt counts as With help.</p>';
  if(lvUp){var to=c.lv+1;h+='<div class="delta"><span>Your record: <b>'+esc(c.topic)+'</b>'+LV[c.lv]+CHEV+LV[to]+'</span><span class="segs" aria-hidden="true">'+[1,2,3].map(function(i){return '<span class="seg'+(i<=c.lv?' f'+i:'')+'" data-to="'+(i===to?'f'+i:'')+'"></span>'}).join('')+'</span></div>'}}
 return '<section class="verdict in" role="status" aria-labelledby="vh">'+h+(S.phase==='elsewhere'?'':'<p class="belief">Saved. Claude adds this to your record on your next message.</p>')+'<p class="cue">'+CUE+'</p></section>'+
  '<div class="done"><button type="button" class="btn" data-act="build">Back to the build</button><a class="tbtn" href="inbox.html">Inbox</a></div>';
}
function render(focusSel){
 clearTimeout(tt);
 var c=C(),m=$('#main'),h='<div class="link"><a class="tbtn" href="inbox.html" style="margin-left:-6px">'+BACK+'Inbox</a><span>Linked to: <b>orbit-pay</b> · cloud session</span></div>';
 m.removeAttribute('aria-busy');
 if(S.phase==='loading'){m.setAttribute('aria-busy','true');
  h+='<div class="qcard" aria-hidden="true"><span class="sk" style="width:120px;height:13px"></span><span class="sk" style="width:180px;height:13px;margin-top:8px"></span><span class="sk" style="width:96%;height:24px;margin-top:20px"></span><span class="sk" style="width:70%;height:24px;margin-top:8px"></span><span class="sk" style="width:120px;height:15px;margin-top:28px"></span><span class="sk" style="height:120px;margin-top:10px;border-radius:14px"></span><span class="sk" style="width:60%;height:44px;margin-top:20px;border-radius:999px"></span><div class="tail"></div></div><p class="vh">Loading the question.</p>';
  m.innerHTML=h;return}
 if(S.phase==='notnow'){h+='<h2 class="gh">Now</h2><p class="empty">Nothing is open now.</p><h2 class="gh">Later</h2><ul class="list"><li><a class="ra" href="#" data-act="reopen"><span class="eb">Later</span><span class="tp">'+esc(c.topic)+'</span><span class="sub">'+esc(S.when)+'</span><span class="rt">'+chip('Open')+'</span></a></li></ul>';
  m.innerHTML=h;return}
 var ro=S.phase!=='edit';
 if(S.phase==='offline')h+='<div class="note" role="status"><p>You are offline. Answers are saved on this device and sent when you are back online.</p></div>';
 h+='<form class="qcard" id="card" aria-labelledby="qp" novalidate>'+head(c);
 if(S.phase==='elsewhere'){
  h+='<div class="note" style="border-color:var(--border)"><p>This question was answered in chat at 14:01.</p><button type="button" class="tbtn" data-act="result">Open the result</button></div>';
  if(S.v){h+=said(c,'You said in chat, 14:01')+verdict(c)}else h+='<div class="tail"></div>';
  return paint(m,h+'</form>',focusSel);
 }
 if(c.code){var ex=excerpt(c,c.code);if(c.shape==='line')ex='';else if(c.showCode)h+=ex;else h+='<details class="code"'+(S.codeOpen?' open':'')+'><summary>Show the code</summary>'+ex+'</details>'}
 if(ro&&c.shape==='text'&&!S.dk){/* answer is quoted below instead */}
 else if(!(ro&&S.dk))h+=control(c,ro);
 if(!ro){h+=confs()+hints(c);if(c.kind==='predict')h+='<p class="quiet">A wrong guess here costs nothing.</p>';h+=abar(c)}
 else{
  h+=said(c);
  var p=S.phase,st='';
  if(p==='locked')st='<b>Locked.</b> Shown after the test runs.';
  else if(p==='grading')st='<b>Locked.</b> <span class="dots">Grading</span>';
  else if(p==='saved')st='<b>Saved.</b> Claude adds it to your record on your next message.';
  else if(p==='offline')st='Your answer is saved on this phone and sent when you are back online.';
  else if(p==='gerr')st='<b>Locked.</b> Grading failed. Try again, or Claude grades it on your next message.';
  if(st)h+='<p class="state" id="st1" tabindex="-1">'+st+'</p>';
  if(p==='gerr')h+='<div class="done"><button type="button" class="btn sm" data-act="retry">Try again</button><button type="button" class="btn ghost sm" data-act="build">Back to the build</button></div>';
  else if(p==='graded')h+=verdict(c);
  else h+='<div class="done"><button type="button" class="btn ghost sm" data-act="build">Back to the build</button></div>';
 }
 paint(m,h+'</form>',focusSel);
}
function paint(m,h,focusSel){
 m.innerHTML=h;S.newHint=false;
 var segs=$$('.seg[data-to]').filter(function(s){return s.dataset.to});
 if(segs.length)setTimeout(function(){segs.forEach(function(s){s.classList.add(s.dataset.to,'lit');setTimeout(function(){s.classList.remove('lit')},450)})},matchMedia('(prefers-reduced-motion: reduce)').matches?0:500);
 if(focusSel){var f=$(focusSel);if(f)f.focus()}
}

/* ---------- events ---------- */
var main=$('#main');
main.addEventListener('submit',function(e){e.preventDefault();lock(false)});
main.addEventListener('input',function(e){
 if(e.target.id==='ans')S.draft=e.target.value;
 if(e.target.id==='other')S.other=e.target.value;
 var h=$('#helper');if(h&&h.classList.contains('warn')&&canLock()){h.classList.remove('warn');h.textContent=''}
});
main.addEventListener('toggle',function(e){if(e.target.classList.contains('code'))S.codeOpen=e.target.open},true);
main.addEventListener('change',function(e){
 var t=e.target;saveDraft();
 if(t.name==='conf'){S.conf=t.value;render('input[name="conf"][value="'+t.value+'"]')}
 else if(t.name==='ch'){S.choice=t.value==='o'?'o':+t.value;render(S.choice==='o'?'#other':'input[name="ch"][value="'+t.value+'"]')}
 else if(t.name==='line'){S.pick=+t.value;render('input[name="line"][value="'+t.value+'"]')}
});
main.addEventListener('click',function(e){
 var mv=e.target.closest('[data-mv]');
 if(mv){saveDraft();var i=+mv.dataset.i,d=+mv.dataset.mv,j=i+d,o=S.order,x=o[i];o[i]=o[j];o[j]=x;render();
  var li=$('.ord li[data-i="'+j+'"]');li.classList.add('moved');var b=$('[data-mv="'+d+'"]',li);if(b.disabled)b=$('[data-mv="'+(-d)+'"]',li);b.focus();
  announce('Moved to '+(j+1)+' of '+o.length+'.');return}
 var s=e.target.closest('[data-snz]');if(s){notNow(s.dataset.snz);return}
 var a=e.target.closest('[data-act]');if(!a)return;var k=a.dataset.act;
 if(k==='hint'){saveDraft();S.hints++;S.newHint=true;render('[data-act="hint"]');if(!$('[data-act="hint"]'))$('.hints ol li:last-child').setAttribute('tabindex','-1'),$('.hints ol li:last-child').focus();announce('Hint '+S.hints+' of 3 shown.')}
 else if(k==='dk')lock(true);
 else if(k==='notnow'){saveDraft();S.snz=!S.snz;render(S.snz?'[data-snz]':'[data-act="notnow"]')}
 else if(k==='retry'){S.phase='grading';render('#st1');announce('Grading.');later(finish,1400)}
 else if(k==='result'){S.draft=GOOD;S.conf='Sure';S.v={w:'right'};render('#vh')}
 else if(k==='reopen'){e.preventDefault();S.phase='edit';$('#toastslot').innerHTML='';render('#ans')}
 else if(k==='build')toast('In the product this opens the orbit-pay session.');
});
$('.me').onclick=function(){toast('Settings has its own prototype: onboarding.html.')};
function notNow(when){S.phase='notnow';S.when=when;S.snz=false;render();$('#main').focus();
 toast('Moved to Later.','Undo',function(){S.phase='edit';render('#ans')||0;var f=$('#ans')||$('input[name="conf"]');if(f)f.focus();announce('Back in Now.')})}
function toast(msg,act,fn){
 var slot=$('#toastslot');clearTimeout(tt);
 slot.innerHTML='<div class="toast"><p>'+esc(msg)+'</p>'+(act?'<button type="button" class="btn ghost sm" id="tact">'+esc(act)+'</button>':'')+'<button type="button" class="x" id="tx" aria-label="Dismiss">&times;</button></div>';
 var t=$('.toast',slot),left=8000,start=Date.now();
 function arm(){start=Date.now();tt=setTimeout(function(){slot.innerHTML=''},left)}
 function pause(){clearTimeout(tt);left-=Date.now()-start}
 t.addEventListener('mouseenter',pause);t.addEventListener('focusin',pause);t.addEventListener('mouseleave',arm);t.addEventListener('focusout',function(e){if(!t.contains(e.relatedTarget))arm()});
 $('#tx').onclick=function(){clearTimeout(tt);slot.innerHTML='';$('#main').focus()};
 if(act)$('#tact').onclick=function(){clearTimeout(tt);slot.innerHTML='';fn()};
 arm();
}
document.addEventListener('keydown',function(e){
 var t=e.target,tag=(t.tagName||'').toLowerCase(),typing=tag==='textarea'||(tag==='input'&&t.type==='text')||tag==='select';
 if(!S)return;
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&S.phase==='edit'){e.preventDefault();saveDraft();lock(false);return}
 if(e.key==='Escape'&&S.snz){S.snz=false;render('[data-act="notnow"]');return}
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='['||e.key===']'){step(e.key===']'?1:-1);return}
 if(e.key==='?'){toast('1 2 3: how sure. '+dkKey()+': I do not know. H: Not now. '+MOD+' Enter: lock. [ and ]: prototype state.');return}
 if(S.phase!=='edit')return;
 var c=C(),k=e.key.toLowerCase(),m={'1':'Guess','2':'Fairly sure','3':'Sure'}[e.key];
 if(m){saveDraft();S.conf=m;render('input[name="conf"][value="'+m+'"]');return}
 if(c.shape==='choice'&&'abcde'.indexOf(k)>=0&&k.length===1){saveDraft();S.choice=k==='e'?'o':'abcd'.indexOf(k);render(S.choice==='o'?'#other':'input[name="ch"][value="'+S.choice+'"]');e.preventDefault();return}
 if(k===dkKey().toLowerCase()){lock(true);return}
 if(k==='h'){$('[data-act="notnow"]').click()}
});
window.addEventListener('online',function(){$('#net').checked=false;netChange()});
window.addEventListener('offline',function(){$('#net').checked=true;netChange()});
function netChange(){if(!S)return;S.net=!$('#net').checked;if(S.net&&S.phase==='offline'){announce('Sent.');S.phase='grading';render('#st1');later(finish,1400)}}
$('#net').onchange=netChange;

/* ---------- prototype switcher ---------- */
var sel=$('#st');ST.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s[0];sel.appendChild(o)});
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function apply(i){
 timers.forEach(clearTimeout);timers=[];clearTimeout(tt);$('#toastslot').innerHTML='';
 var x=ST[i];sel.value=i;$('#net').checked=x[0].indexOf('offline')===0;
 x[1]();$('#rnote').textContent=x[2];$('#rsys').textContent=x[3];
 try{var u=new URL(location.href);u.searchParams.set('state',slug(x[0]));history.replaceState(null,'',u)}catch(err){}
 render();
 if(S.phase==='notnow')toast('Moved to Later.','Undo',function(){S.phase='edit';render('#ans');announce('Back in Now.')});
 syncFrame();
}
function step(d){apply((+sel.value+d+ST.length)%ST.length)}
sel.onchange=function(){apply(+sel.value)};$('#prev').onclick=function(){step(-1)};$('#next').onclick=function(){step(1)};
var th=$('#theme'),vw=$('#vw');
try{th.value=Q.get('theme')||localStorage.getItem('room-theme')||''}catch(err){}
function setTheme(){if(th.value)document.documentElement.setAttribute('data-theme',th.value);else document.documentElement.removeAttribute('data-theme');try{if(!EMBED)localStorage.setItem('room-theme',th.value)}catch(err){};syncFrame()}
function syncFrame(){var w=vw.value;$('#vpwrap').hidden=!w;$('#app').hidden=!!w;if(!w)return;var f=$('#vpf');f.style.width=w+'px';
 var src='card.html?embed=1&state='+slug(ST[+sel.value][0])+'&theme='+th.value;if(f.getAttribute('src')!==src)f.setAttribute('src',src)}
th.onchange=setTheme;vw.onchange=syncFrame;
var q=Q.get('state'),start=1;ST.forEach(function(s,i){if(q&&(slug(s[0])===q||String(i+1)===q))start=i});
if(th.value)document.documentElement.setAttribute('data-theme',th.value);
apply(start);
})();
</script>
