<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explainer</title>
<meta name="description" content="Prototype of an explainer page: what it explains, reading time, the path of one charge, and sections that open after a prediction. Each prediction enters the review schedule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../assets/room.css">
<style>
*{box-sizing:border-box}
html{scroll-padding:80px 0 24px}
body{position:relative;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;background-image:url(../assets/grain.png);background-size:240px 240px;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--ink);text-underline-offset:4px}
button{font-family:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype controls: outside the product, dashed so nobody reads them as product UI */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px auto;max-width:1180px;padding:8px 12px;border:1.5px dashed var(--control-border);border-radius:12px;font:500 12px/1.3 var(--mono);color:var(--text-3);width:calc(100% - 32px)}
.proto label{display:flex;align-items:center;gap:8px}
.proto select,.proto button{font:500 12.5px var(--mono);min-height:44px;padding:0 10px;border:1.5px solid var(--control-border);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%;cursor:pointer}
.proto select#st{max-width:min(360px,58vw)}
.proto .sp{flex:1}
/* buttons */
.btn{font:600 16px/1 var(--sans);min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#16161A}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:var(--field);border-color:var(--field);color:var(--text-3);cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 18px}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;font:600 15px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.kc{display:inline-flex;align-items:center;height:22px;padding:0 6px;border:1.5px solid currentColor;border-radius:6px;font:500 11.5px var(--mono);opacity:.8}
@media (hover:none){.kc{display:none}}
/* shells */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;min-height:56px;padding:0 32px;display:flex;align-items:center;gap:14px}
.word{font-size:19px;font-weight:650;font-variation-settings:"wdth" 88;letter-spacing:-.01em}
.proj{font:500 13px var(--mono);color:var(--text-3)}
.bar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.gates{display:flex;gap:4px}
.gates i{width:22px;height:14px;border-radius:3px;background:var(--lv0);transition:background-color .4s var(--ease-out),transform .4s var(--ease-spring)}
.gates i{box-shadow:inset 0 0 0 1.5px var(--control-border)}
.gates i.on{background:var(--ink)}
.gates i.sk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--control-border)}
.me{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-weight:650;font-size:16px;cursor:pointer}
.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:24px}
.tab{font:600 15px/1 var(--sans);min-height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-3);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.banner{max-width:1180px;margin:0 auto;padding:0 32px 10px}
.banner p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;font-size:15px;line-height:1.5}
.banner p .btn{min-height:44px;font-size:15px;padding:0 18px;background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.banner.stale p{border-color:var(--accent-text);border-width:2px}
.wrap{max-width:1180px;margin:0 auto;padding:32px 32px 120px}
.layout{display:grid;grid-template-columns:200px minmax(0,680px);gap:72px;justify-content:center}
.toc{position:sticky;top:96px;align-self:start;font-size:14px}
.toc h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text-3)}
.toc ol{list-style:none;margin:0;padding:0;border-left:1.5px solid var(--border)}
.toc a{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0 4px 14px;margin-left:-1.5px;border-left:1.5px solid transparent;text-decoration:none;color:var(--text-3);line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc a.cur{color:var(--ink);border-color:var(--accent)}
.toc .st{flex:none;font:500 11px var(--mono);color:var(--text-3)}
/* article */
.eb{font-size:13px;font-weight:500;color:var(--accent-text)}
h1.t{margin:10px 0 0;font-size:46px;line-height:1.06;letter-spacing:-.02em;font-weight:650;font-variation-settings:"wdth" 88;text-wrap:balance}
.what{margin:16px 0 0;font-size:19px;line-height:1.6;color:var(--text-2);text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;font:500 13px var(--mono);color:var(--text-3)}
.prose{font-size:17px;line-height:1.6;color:var(--text-2)}
.prose p{margin:14px 0 0;text-wrap:pretty}
.prose code,.mono{font:500 .86em var(--mono);color:var(--ink)}
h2.s{margin:0;font-size:24px;line-height:1.3;font-weight:650;font-variation-settings:"wdth" 88}
.sec{margin-top:56px}
.panel{margin-top:28px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px 24px 18px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.ptitle{font-size:17px;font-weight:650}
.toggle{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.tg{font:600 14px/1 var(--sans);min-height:44px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,color .25s}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.flow{position:relative;padding:22px 0 4px}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.box{min-height:56px;border-radius:12px;background:var(--card);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:600;padding:4px 6px;line-height:1.25}
.box.dk{background:var(--ink);color:var(--on-ink)}
.box .m{font:500 12px var(--mono)}
.track{position:relative;height:30px}
.track .line{position:absolute;left:12.5%;right:12.5%;top:14px;height:2px;background:var(--border)}
.tick{position:absolute;top:8px;width:2px;height:14px;background:var(--border);margin-left:-1px}
.dot{position:absolute;top:8px;left:12.5%;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-left:-7px;box-shadow:0 0 0 5px var(--accent-wash)}
.cut{position:absolute;top:2px;left:50%;transform:translateX(-50%);display:flex;background:var(--card);border-radius:50%}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.step{text-align:center;font:500 11.5px/1.3 var(--mono);color:var(--text-3)}
.fnote{margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--text-3)}
/* embedded card */
.qc{margin-top:22px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px 24px;transition:transform .3s var(--ease-out)}
.qc.live{box-shadow:inset 3px 0 0 var(--accent)}
.qc.nudge{transform:translateY(-8px)}
.qhd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px}
.seal{font:500 12px var(--mono);color:var(--text-3)}
.qq{margin:8px 0 0;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.01em;text-wrap:pretty}
.opts{margin-top:14px;border-bottom:1px solid var(--border)}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;min-height:56px;padding:12px 4px;border:0;border-top:1px solid var(--border);background:transparent;color:var(--ink);font:500 17px/1.4 var(--sans);cursor:pointer;transition:padding .2s}
.opt:hover:not([disabled]){padding-left:12px}
.opt .k{font:500 13px/1 var(--mono);color:var(--text-3)}
.opt[aria-checked="true"]{font-weight:650}
.opt[aria-checked="true"] .k{color:var(--accent-text)}
.opt[disabled]{cursor:default}
.opt.dim{color:var(--text-dim)}
.opt .ak{grid-column:2;font:500 12px var(--mono);color:var(--ink);margin-top:2px}
.opt.ans{color:var(--ink)}
label.fl{display:block;margin-top:16px;font-weight:600;font-size:15px}
textarea{display:block;width:100%;margin-top:8px;padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--control-border);border-radius:14px;resize:vertical}
textarea[readonly]{background:var(--paper)}
fieldset{margin:18px 0 0;padding:0;border:0}
legend{padding:0;font-size:15px;color:var(--text-3);margin-bottom:10px}
.confs{display:flex;flex-wrap:wrap;gap:8px}
.sure{position:relative;display:inline-flex;align-items:center;font:500 15px/1 var(--sans);min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--control-border);background:transparent;color:var(--text-2);cursor:pointer}
.sure:hover{border-color:var(--ink)}
.sure input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sure:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.sure:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
.sure:has(input:disabled){cursor:default}
.sure.dk{border-style:dashed}
.mean{margin:8px 0 0;font-size:14px;color:var(--text-3);min-height:22px}
.hints{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px;color:var(--text-3)}
.hl3{display:flex;gap:3px}.hl3 i{width:18px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--ink)}.hl3 i.u{background:var(--ink)}
.hlist{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hlist li{padding:10px 14px;background:var(--paper);border-radius:12px;font-size:15px;line-height:1.5;color:var(--ink)}
.hlist b{font:500 12px var(--mono);margin-right:8px;color:var(--text-3)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:20px}
.helper{margin:10px 0 0;font-size:14px;color:var(--text-3)}
.state{margin:14px 0 0;font-size:15px;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);font:500 12px var(--mono);white-space:nowrap;vertical-align:2px}
.chip.locked{background:var(--ink);color:var(--on-ink)}
.chip.saved{border-style:dashed}
/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:18px}
figure{margin:0;min-width:0}
figcaption{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:8px}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--border);font-size:16px;line-height:1.5}
blockquote+.chip{margin:8px 0 0 14px}
.out{margin:0;padding:12px 14px;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;font:500 12.5px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.out .c{color:var(--text-3)}
.vd{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.vw{margin:0;font-size:22px;font-weight:700;color:var(--accent-text)}
.vw.ok{color:var(--ink)}
.why{margin:6px 0 0;font-size:16px;line-height:1.6;color:var(--text-2);text-wrap:pretty}
.belief{margin:10px 0 0;padding:8px 14px;border-left:3px solid var(--accent);font-size:15px;line-height:1.6}
.note{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--text-3)}
.next{margin:8px 0 0;font-size:15px;font-weight:600}
.in{animation:rise .6s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* gated section */
.gate{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease-out)}
.gate>div{min-height:0;overflow:hidden}
.gate.open{grid-template-rows:1fr}
.peek{position:relative;margin-top:22px;max-height:84px;overflow:hidden;opacity:.5;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
.peek+.lockline{margin:4px 0 0;font-size:14px;color:var(--text-3);display:flex;align-items:center;gap:8px}
pre.code,.out{font-variant-ligatures:none}
pre.code{margin:18px 0 0;padding:14px 18px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;font:500 13px/1.8 var(--mono);overflow-x:auto;color:var(--ink)}
pre.code .hd{display:block;color:var(--text-3)}
pre.code .ln{display:block;margin:0 -18px;padding:0 18px;white-space:pre}
pre.code i{display:inline-block;width:2.4em;color:var(--text-3);font-style:normal}
pre.code .hl{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--ink)}
/* end */
.endb{margin-top:64px;padding:26px 28px;background:var(--card);border:1.5px solid var(--ink);border-radius:18px}
.endb h2{margin:0;font-size:24px;line-height:1.3;font-weight:650;font-variation-settings:"wdth" 88}
.endb ul{list-style:none;margin:16px 0 0;padding:0}
.endb li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.endb li .d{font:500 13px var(--mono);color:var(--text-3);align-self:center}
.cue{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);font:500 13px/1.7 var(--mono)}
.pending{margin-top:64px;font-size:15px;color:var(--text-3);border-top:1px solid var(--border);padding-top:18px}
/* Room empty and the chat door */
.solo{max-width:640px;margin:0 auto}
.empty{margin-top:24px;padding:28px 24px;background:var(--card);border:1.5px solid var(--border);border-radius:18px}
.empty p{margin:0;font-size:17px;line-height:1.6;color:var(--text-2)}
.empty .acts{margin-top:18px}
.frame{border:1.5px solid var(--ink);border-radius:18px;background:var(--card);overflow:hidden}
.fh{display:flex;align-items:center;gap:8px;padding:0 16px;height:44px;border-bottom:1.5px solid var(--border);font:500 12.5px var(--mono);color:var(--text-3)}
.fh i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--control-border)}
.fh span{margin-left:8px}
.msgs{padding:16px;display:grid;gap:14px}
.msg{max-width:92%;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.msg.you{justify-self:end;padding:10px 14px;background:var(--field);border-radius:14px}
.msg .who{display:block;font:500 11.5px var(--mono);color:var(--text-3);margin-bottom:2px}
.msg .acts{margin-top:10px}
.skel{margin-top:10px;padding:14px;border:1.5px solid var(--border);border-radius:14px}
.skel i{display:block;height:10px;border-radius:3px;background:var(--field);margin-top:10px}
.skel i:first-child{height:18px;width:60%;margin-top:0}
.skel i:nth-child(3){width:80%}
.fn{margin:12px 0 0;font-size:14px;color:var(--text-3)}
@media (max-width:1040px){.layout{grid-template-columns:minmax(0,680px)}.toc{display:none}}
@media (max-width:640px){
.bar,.banner,.tabs{padding-left:16px;padding-right:16px}
.bar .proj{display:none}.bar .end .btn{padding:0 14px}
.wrap{padding:20px 16px 96px}
h1.t{font-size:31px}.what{font-size:17px}.prose{font-size:16px}h2.s{font-size:20px}
.qc,.panel{padding:16px;border-radius:14px}.qq{font-size:20px}
.cmp{grid-template-columns:minmax(0,1fr);gap:14px}
.box{font-size:12px;min-height:52px;border-radius:10px}.step{font-size:10px}
.acts .btn.primary{width:100%}
.endb{padding:18px 16px}
.sec{margin-top:44px}
.proto{gap:6px 8px}.proto .sp{display:none}.proto label[for=st]{flex-basis:100%}.proto select#st{flex:1 1 200px;max-width:none;min-width:0}
}
@media (prefers-reduced-motion:reduce){
.in{animation:none}
.gate,.qc,.gates i,.btn,.opt,.tg{transition:none}
.qc.nudge{transform:none}
}
</style>
</head>

 setTimeout(function(){var t=c.text.toLowerCase();var same=/same|stor|first|earlier|original|cached|previous/.test(t),one=/\bone\b|\bonce\b|\b1\b|single|no (new|second|double)|not (again|twice)/.test(t);c.grade=same&&one?'right':(same||one?'part':'wrong');c.st='graded';render('#vf'+i);say(({right:'Correct.',part:'Not quite.',wrong:'No.'})[c.grade])},1400);
}
function nudge(i){var q=$('#q'+i);if(!q||RM.matches)return;q.classList.add('nudge');setTimeout(function(){q.classList.remove('nudge')},300)}

document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b||b.closest('.proto'))return;
 var f=b.closest('form'),i=f?+f.dataset.i:-1,c=i>-1?M.cards[i]:null,a=b.dataset.act;
 if(b.dataset.opt!==undefined&&c){c.pick=+b.dataset.opt;render('#q'+i+' [data-opt="'+c.pick+'"]');return}
 if(b.dataset.flow){M.flow=b.dataset.flow;render('[data-flow="'+M.flow+'"]');play();return}
 if(a==='play')return play();
 if(a==='expand'){c.expanded=true;render('#q'+i+' .opt, #ta'+i);return}
 if(a==='hint'){c.hints++;render(c.hints<3?'#q'+i+' [data-act="hint"]':'#q'+i+' [data-act="show"]');say('Hint '+c.hints+' of 3 shown.');return}
 if(a==='dk'){c.dk=true;c.conf=null;c.grade='dk';c.st='graded';c.justOpened=true;if(CARDS[i].shape==='text')c.text='';render('#vf'+i);return}
 if(a==='show'){c.st='shown';c.justOpened=true;render('#vf'+i);say('Section open. Not answered.');return}
 if(a==='copy'){try{navigator.clipboard&&navigator.clipboard.writeText('explain PR 128')}catch(x){}M.copied=true;render('[data-act="copy"]');return}
 if(a==='finish'){M.ready=true;render('[data-act="openx"]');return}
 if(a==='openx'){M=fresh();render('h1.t');window.scrollTo(0,0);play();return}
 if(a==='rebuild'){M=fresh();M.view='chat';render('[data-act="finish"]');return}
 if(a==='build'){var n=M.cards.filter(function(x){return x.st==='graded'||x.st==='saved'}).length;M.view='chat';M.backFrom=n?n+' question'+(n>1?'s':'')+' from the explainer '+(n>1?'are':'is')+' in your reviews.':'Nothing from the explainer was added to your reviews.';render();window.scrollTo(0,0);return}
 if(a==='room'){M=fresh();M.view='room';render();return}
});
document.addEventListener('change',function(e){var t=e.target;if(t.name&&/^cf/.test(t.name)){var i=+t.name.slice(2);M.cards[i].conf=t.value;render('#q'+i+' input[value="'+t.value+'"]')}});
document.addEventListener('input',function(e){var t=e.target;if(t.id&&/^ta/.test(t.id)){var i=+t.id.slice(2);M.cards[i].text=t.value;var k2=!!M.cards[i].conf+'|'+(t.value.trim().length>2);if(M.cards[i]._k!==k2){M.cards[i]._k=k2;render('#ta'+i);var n=$('#ta'+i);n.setSelectionRange(n.value.length,n.value.length)}}});
document.addEventListener('submit',function(e){e.preventDefault();var i=+e.target.dataset.i;var b=$('#q'+i+' [data-act="lock"]');if(b&&!b.disabled)lock(i)});
document.addEventListener('keydown',function(e){
 var t=e.target,inField=/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&t.type!=='radio';
 var i=firstOpen(),f=t.closest&&t.closest('form.qc');if(f)i=+f.dataset.i;
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&i>-1){e.preventDefault();var b=$('#q'+i+' [data-act="lock"]');if(b&&!b.disabled)lock(i);return}
 if(inField||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='['){go(cur-1);return}if(e.key===']'){go(cur+1);return}
 if(M.view!=='page'||i<0||M.cards[i].st!=='wait'||M.stale)return;
 var c=M.cards[i];
 if(/^[123]$/.test(e.key)){c.conf=CONF[+e.key-1][0];render('#q'+i+' input[value="'+c.conf+'"]')}
 else if(/^[dD]$/.test(e.key)){$('#q'+i+' [data-act="dk"]').click()}
 else if(t.getAttribute&&t.getAttribute('role')==='radio'&&/Arrow(Down|Up|Left|Right)/.test(e.key)){e.preventDefault();var n=CARDS[i].opts.length,j=(+t.dataset.opt+(/Down|Right/.test(e.key)?1:n-1))%n;c.pick=j;render('#q'+i+' [data-opt="'+j+'"]')}
});

/* state switcher */
var cur=0,sel=$('#st');
STATES.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.label;sel.appendChild(o)});
function go(n){cur=(n+STATES.length)%STATES.length;sel.value=cur;preset(STATES[cur].key);render();setTimeout(play,250);
 var target={answered:'#s2',right:'#s1',wrong:'#s1',surewrong:'#s1',shown:'#s1',end:'#endh',offline:'#s1'}[STATES[cur].key];
 if(target&&location.search.indexOf('noscroll')<0){var el=$(target);if(el)el.scrollIntoView({block:'start'})}else window.scrollTo(0,0);
 try{history.replaceState(null,'','?state='+STATES[cur].key+(location.search.indexOf('noscroll')>-1?'&noscroll':''))}catch(x){}}
sel.addEventListener('change',function(){go(+sel.value)});
$('#prev').addEventListener('click',function(){go(cur-1)});
$('#next').addEventListener('click',function(){go(cur+1)});
$('#theme').addEventListener('change',function(e){var v=e.target.value;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme')});
var q=/state=([a-z]+)/.exec(location.search),start=2;
if(q)STATES.forEach(function(s,i){if(s.key===q[1])start=i});
go(start);
})();
</script>
