# This file exists only to hold tool settings. The repo ships skills, not a
# package, but vulture exits 2 without a [tool.vulture] section naming its paths,
# and the shared pre-commit config is byte-identical across repos, so the settings
# have to live where those tools read them.

[tool.vulture]
min_confidence = 80
paths = ["skills"]

[tool.codespell]
skip = "*.lock,*/package-lock.json,.git"

[tool.ruff]
# The scripts import tomllib, which is stdlib from 3.11. With no version declared
# ruff resolves the target to 3.10, calls tomllib third-party, and isort then moves
# it out of the stdlib block. Measured: declaring 3.11 restores that grouping and
# adds no other finding, and ruff format produces byte-identical output either way.
target-version = "py311"
